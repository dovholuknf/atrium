<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atrium</title>
<link rel="stylesheet" href="/css/tokens.css">
<!--
  ONE FILE, IN A TAB OF ITS OWN.

  The board's editor is a panel in a drawer beside a terminal, which is right
  for changing one line and cramped for reading a long file next to the output
  that produced it. This is the same file with the window to itself, and for
  markdown it is the file RENDERED.

  ── what it reads, and why not the file's own bytes ───────

  The bytes come from `/v1/tasks/<id>/files/view`, which streams the card's file
  as text/plain (or a raster image) with nosniff and a sandbox CSP, so an HTML or
  SVG file an agent wrote is never served as itself on the board's origin. Plain
  text and images are opened at that address directly. Only markdown comes here,
  because it is the one thing that needs turning into a page.

  ── the markdown is not trusted ──────────────────────────

  `vendor/marked.js` makes HTML out of it and `vendor/purify.js` takes out
  anything that can run: see `read.js`. Raw HTML in the document is shown as
  text, never parsed. The page's own CSP forbids inline script, so a hole in the
  sanitizer is still not script.

  ── the address ──────────────────────────────────────────

  The card and the path are in the FRAGMENT, not the query. A fragment is not
  sent to the server on navigation and does not reach a proxy's log: the path
  is only ever transmitted by the fetch, which needs it, and never by the
  act of opening the tab.
-->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<style>
  body {
    margin: 0; background: var(--bg-1); color: var(--body);
    font: var(--fs-base)/1.5 var(--sans);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--stroke-dim);
    background: var(--shell-0); position: sticky; top: 0;
  }
  header code { font: var(--fs-sm)/1.4 var(--mono); color: var(--head); }
  header .by { color: var(--dim); font-size: var(--fs-sm); margin-left: auto; }
  pre {
    margin: 0; padding: 18px; white-space: pre-wrap; word-break: break-word;
    font: var(--fs-sm)/1.55 var(--mono); color: var(--head); tab-size: 4;
  }
  .md { max-width: 52rem; margin: 0 auto; padding: 18px 22px 60px; color: var(--body); }
  .md h1, .md h2, .md h3, .md h4 { color: var(--head); line-height: 1.25; margin: 1.4em 0 .5em; }
  .md h1, .md h2 { border-bottom: 1px solid var(--stroke-dim); padding-bottom: .25em; }
  .md a { color: var(--head); text-decoration: underline; }
  .md code { font: var(--fs-sm)/1.4 var(--mono); background: var(--shell-0); padding: .1em .35em; border-radius: 4px; }
  .md pre { background: var(--shell-0); padding: 12px 14px; border-radius: 6px; overflow: auto; white-space: pre; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--stroke-dim); color: var(--dim); }
  .md table { border-collapse: collapse; } .md th, .md td { border: 1px solid var(--stroke-dim); padding: 4px 10px; }
  .md img { max-width: 100%; }
  .oops { padding: 18px; color: var(--warn); }
</style>
</head>
<body>
<header><code id="where">reading…</code><span class="by" id="what"></span></header>
<pre id="text"></pre>
<article id="md" class="md" hidden></article>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/read.js"></script>
</body>
</html>
