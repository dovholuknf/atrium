<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atrium</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/themes.css">
<!--
  ONE FILE, IN A TAB OF ITS OWN.

  The board's editor is a panel in a drawer beside a terminal, which is right
  for changing one line and cramped for reading a long file next to the output
  that produced it. This is the same file with the window to itself, and for
  markdown it is the file RENDERED.

  ── what it reads, and why not the file's own bytes ───────

  The bytes come from `/v1/tasks/<id>/files/view`, which streams the card's file
  as text/plain, a raster image or a PDF, with nosniff, so an HTML or SVG file an
  agent wrote is never served as itself on the board's origin. This page shows it
  by type: a picture as an image, an SVG as an image made from a blob (an image
  runs no script), a PDF in the browser's own viewer, markdown rendered, JSON
  indented, and everything else as text. An HTML file is its source, or on
  request (`?render`) drawn in a frame with an empty sandbox: see `read.js`.

  ── the markdown is not trusted ──────────────────────────

  `vendor/marked.js` makes HTML out of it and `vendor/purify.js` takes out
  anything that can run: see `read.js`. Raw HTML in the document is shown as
  text, never parsed. The page's own CSP forbids inline script, so a hole in the
  sanitizer is still not script.

  ── the address ──────────────────────────────────────────

  The card and the path are in the FRAGMENT, not the query. A fragment is not
  sent to the server on navigation and does not reach a proxy's log: the path
  is only ever transmitted by the fetch, which needs it, and never by the
  act of opening the tab.
-->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<style>
  /* THE TEXT SIZE is this page's own, in px, set from read.js off a key of its own. Browser zoom is per origin
     and would take the board with it. */
  :root { --read-fs: 15px; }
  /* tokens.css gives the board a body that never scrolls as a whole, because its views scroll inside themselves.
     This page IS one document, so the window scrolls and draws its bar. */
  html, body { height: auto; overflow: visible; }
  html { overflow-y: scroll; }
  body {
    display: block; min-height: 100%;
    margin: 0; background: var(--bg-1); color: var(--body);
    font: var(--read-fs)/1.5 var(--sans);
  }
  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--stroke-dim);
    background: var(--shell-0); position: sticky; top: 0; z-index: 1;
  }
  header .by { margin-left: auto; }
  .zoom { display: flex; align-items: center; gap: 4px; }
  .zoom button {
    display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px;
    border: 1px solid var(--stroke-dim); background: var(--chip);
    color: var(--label); border-radius: var(--r-sm); font: var(--fs-base) var(--sans); cursor: pointer;
  }
  .zoom button:hover { background: var(--lift); color: var(--head); }
  .zoom button[aria-pressed="true"] { background: var(--lift); color: var(--head); border-color: var(--stroke); }
  header select {
    height: 24px; max-width: 11rem; border: 1px solid var(--stroke-dim); background: var(--chip);
    color: var(--label); border-radius: var(--r-sm); font: var(--fs-base) var(--sans);
  }
  .zoom .val { min-width: 34px; text-align: center; color: var(--head); font: var(--fs-base) var(--mono); }
  header code { font: var(--fs-sm)/1.4 var(--mono); color: var(--head); }
  header .by { color: var(--dim); font-size: var(--fs-sm); }
  pre {
    margin: 0; padding: 18px; white-space: pre-wrap; word-break: break-word;
    font: calc(var(--read-fs) - 1px)/1.55 var(--mono); color: var(--head); tab-size: 4;
  }
  /* THE READING WIDTH is this page's own, set from read.js on <html data-width>. Narrow is the prose measure. Every
     top-level block keeps it, centred, and a table is let past it to the right, to the window's edge, and then scrolls. */
  :root { --read-w: 52rem; }
  :root[data-width="wide"] { --read-w: 84rem; }
  :root[data-width="full"] { --read-w: 100%; }
  .md { margin: 0; padding: 18px 22px 60px; color: var(--body); }
  .md > * { max-width: var(--read-w); margin-left: auto; margin-right: auto; }
  .md table { display: block; width: max-content; max-width: 100%; overflow-x: auto; }
  .md > table {
    --col-off: max(0px, calc((100% - var(--read-w)) / 2));
    margin-left: var(--col-off); margin-right: 0; max-width: calc(100% - var(--col-off));
  }
  .md h1, .md h2, .md h3, .md h4 { color: var(--head); line-height: 1.25; margin-top: 1.4em; margin-bottom: .5em; }
  .md h1, .md h2 { border-bottom: 1px solid var(--stroke-dim); padding-bottom: .25em; }
  .md a { color: var(--head); text-decoration: underline; }
  .md code { font: .9em/1.4 var(--mono); background: var(--shell-0); padding: .1em .35em; border-radius: 4px; }
  .md pre { background: var(--shell-0); padding: 12px 14px; border-radius: 6px; overflow: auto; white-space: pre; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin-top: 1em; margin-bottom: 1em; padding: 0 1em; border-left: 3px solid var(--stroke-dim); color: var(--dim); }
  .md table { border-collapse: collapse; } .md th, .md td { border: 1px solid var(--stroke-dim); padding: 4px 10px; }
  .md img { max-width: 100%; }
  .oops { padding: 18px; color: var(--warn); }
  .oops a { color: var(--head); }
  .pic { display: block; max-width: calc(100% - 36px); margin: 18px auto; background: var(--shell-0); }
  :root.plain body { background: #1c1c1c; }
  :root.plain body::before, :root.plain .zoom, :root.plain #skin { display: none; }
  :root.plain header, :root.plain .pic { background: none; }
  .pdf { display: block; width: 100%; height: calc(100vh - 56px); border: 0; }
  /* A page with no background of its own is drawn on white, as a browser would draw it, above the grid on body::before. */
  .page { position: relative; z-index: 1; background: #fff; }
  .sharebtn, .sharebox button {
    height: 24px; padding: 0 10px; border: 1px solid var(--stroke-dim); background: var(--chip);
    color: var(--label); border-radius: var(--r-sm); font: var(--fs-base) var(--sans); cursor: pointer;
  }
  .sharebtn:hover, .sharebox button:hover { background: var(--lift); color: var(--head); }
  .sharebtn:disabled { opacity: .6; cursor: default; }
  .sharebox {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 8px 18px;
    border-bottom: 1px solid var(--stroke-dim); background: var(--shell-0); color: var(--dim); font-size: var(--fs-sm);
  }
  .sharebox input {
    flex: 1 1 18rem; min-width: 0; height: 24px; padding: 0 8px; border: 1px solid var(--stroke-dim);
    background: var(--chip); color: var(--head); border-radius: var(--r-sm); font: var(--fs-sm) var(--mono);
  }
</style>
</head>
<body>
<header><code id="where">reading…</code><span class="by" id="what"></span>
  <span class="zoom" title="Text size for every read tab. Ctrl+= bigger, Ctrl+- smaller, Ctrl+0 reset.">
    <button id="zoom-down" type="button" aria-label="smaller text">A&minus;</button>
    <span class="val" id="zoom-val"></span>
    <button id="zoom-up" type="button" aria-label="bigger text">A+</button>
  </span>
  <span class="zoom" id="width" role="group" title="Reading width for every read tab.">
    <button type="button" data-width="narrow" aria-label="narrow column">Narrow</button>
    <button type="button" data-width="wide" aria-label="wide column">Wide</button>
    <button type="button" data-width="full" aria-label="the whole window">Full</button>
  </span>
  <select id="skin" aria-label="skin for this page only"></select>
  <button id="share-doc" type="button" class="sharebtn" hidden>Share publicly</button>
  <button id="html-mode" type="button" class="sharebtn" hidden>Show it rendered</button></header>
<div id="share-box" class="sharebox" hidden>
  <input id="share-url" type="text" readonly aria-label="public address">
  <button id="share-copy" type="button">Copy</button>
  <span id="share-note"></span>
  <button id="share-stop" type="button">Stop</button>
</div>
<div id="share-err" class="oops" hidden></div>
<pre id="text"></pre>
<article id="md" class="md" hidden></article>
<img id="pic" class="pic" alt="" hidden>
<iframe id="pdf" class="pdf" title="the PDF" hidden></iframe>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/read.js"></script>
</body>
</html>
