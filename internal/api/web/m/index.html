<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="atrium">
<title>atrium</title>
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/m/icons/icon-192.png">
<script>
// The skin before first paint, from what the board remembered, so the page never flashes the default palette.
(function () {
  try {
    var room = localStorage.getItem("atrium.room") || "";
    var s = localStorage.getItem("atrium.skin" + (room ? "." + room : ""));
    if (s) document.documentElement.setAttribute("data-skin", s);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/m/m.css">
<link rel="stylesheet" href="/m/compose.css">
<link rel="stylesheet" href="/m/cardurl.css">
<link rel="stylesheet" href="/m/working.css">
</head>
<body class="m">
<div class="app">
  <header class="bar">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="mg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--teal)"/><stop offset="1" stop-color="var(--blue)"/></linearGradient></defs><path d="M6 26 L16 6 L26 26 M10.5 19 H21.5" fill="none" stroke="url(#mg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="room" id="m-room" hidden></span>
    <span class="grow"></span>
    <span class="live" id="m-live" role="status" aria-label="connecting"></span>
    <button type="button" id="m-bell" class="bell" aria-label="notifications"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 21h4"/><path class="slash" d="M4 4l16 16"/></svg><span class="n" id="m-bell-n"></span></button>
    <a class="board" id="m-desktop" href="/" aria-label="open the desktop board">desktop board</a>
  </header>

  <main class="home" id="m-home">
    <div class="titlebar">
      <div class="h1row">
        <h1 id="m-h1">Needs you</h1>
        <button type="button" id="m-opts-btn" class="optsbtn" aria-expanded="false" aria-controls="m-opts" data-on="0"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>view</span></button>
      </div>
      <div class="opts" id="m-opts" hidden>
        <div class="orow"><span>order</span><button type="button" data-opt="order" data-val="newest">newest</button><button type="button" data-opt="order" data-val="oldest">oldest</button></div>
        <p class="quiet ohint">order is for the list you are on. needs you goes by when the wait began, all by last activity.</p>
        <div class="orow"><span>group</span><button type="button" data-opt="group" data-val="none">none</button><button type="button" data-opt="group" data-val="room">room</button><button type="button" data-opt="group" data-val="project">project</button></div>
        <div class="orow"><span>show</span><button type="button" data-opt="needsMe">needs me only</button><button type="button" data-opt="hideDone">hide finished</button><button type="button" data-opt="hideSubs">hide subagents</button></div>
      </div>
      <div class="seg" id="m-seg" data-mode="needs" role="tablist">
        <button type="button" id="m-seg-needs" role="tab" aria-selected="true">needs you <em>0</em></button>
        <button type="button" id="m-seg-all" role="tab" aria-selected="false">all <em>0</em></button>
      </div>
    </div>
    <div class="chips" id="m-chips">
      <div class="roomchip" id="m-room-chip" hidden><span id="m-room-name"></span><button type="button" id="m-room-all">all rooms</button></div>
      <button type="button" class="hiddenline" id="m-hidden" hidden></button>
    </div>
    <div class="growl" id="m-growl" hidden></div>
    <div class="skel" id="m-skel" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="list" id="m-list"></div>
    <div class="empty" id="m-empty" hidden>
      <div class="ring"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Nothing needs you</h2>
      <p>Every session is working or resting.</p>
      <p class="quiet" id="m-empty-all"></p>
    </div>
    <div class="empty" id="m-none" hidden>
      <h2>No sessions yet</h2>
      <p>Start one from the board and it shows up here.</p>
    </div>
  </main>

  <section class="logsheet" id="m-log" hidden aria-label="notifications">
    <div class="log-top"><h2>Notifications</h2><span class="grow"></span><button type="button" id="m-log-mute">sound on</button><button type="button" id="m-log-close">close</button></div>
    <div class="log-list" id="m-log-list"></div>
  </section>

  <section class="sheet" id="m-card" hidden aria-label="card">
    <div class="sheet-top">
      <button type="button" id="m-card-back" class="back" aria-label="back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">all cards</span></button>
      <span class="grow"></span>
      <button type="button" id="m-card-pick" class="pick" aria-expanded="false" aria-controls="m-card-menu">cards <span aria-hidden="true">&#9662;</span></button>
      <a id="m-card-term" class="term" href="/">open terminal</a>
    </div>
    <div class="pickmenu" id="m-card-menu" hidden></div>
    <div class="sheet-scroll" id="m-card-scroll">
      <div id="m-card-head" class="chead"></div>
      <div id="m-card-notices"></div>
      <div id="m-replies" class="conv"></div>
      <div id="m-card-extras"></div>
      <section id="m-perms"></section>
    </div>
    <div class="jump-wrap"><button type="button" id="m-jump" class="jump" aria-label="Jump to latest" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div id="m-working" class="working" hidden role="status" aria-live="polite"></div>
    <div id="m-compose"></div>
    <div id="m-recap" class="recap" hidden></div>
    <section class="viewer" id="m-viewer" hidden aria-label="file">
      <div class="v-top">
        <button type="button" id="m-viewer-back" class="back" aria-label="back to the thread"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="v-title" id="m-viewer-title"></span>
      </div>
      <div class="v-scroll" id="m-viewer-scroll"><div id="m-viewer-body"></div></div>
    </section>
  </section>
</div>
<script src="/js/cardrules.js"></script>
<script src="/js/sounds.js"></script>
<script src="/m/js/util.js"></script>
<script src="/m/js/md.js"></script>
<script src="/m/js/store.js"></script>
<script src="/m/js/home.js"></script>
<script src="/m/js/bell.js"></script>
<script src="/m/js/growl.js"></script>
<script src="/m/js/card.js"></script>
<script src="/m/js/viewer.js"></script>
<script src="/m/js/compose.js" onerror="void 0"></script>
<script src="/m/js/perms.js" onerror="void 0"></script>
<script>
(function () {
  function themeColor() {
    var m = document.querySelector('meta[name="theme-color"]');
    var c = getComputedStyle(document.body).getPropertyValue("--bg-0").trim();
    if (m && c) m.setAttribute("content", c);
  }
  window.mHome.init();
  window.mGrowl.init();
  window.mCard.init();
  window.mViewer.init();
  window.mBell.init();
  var live = document.getElementById("m-live"), room = document.getElementById("m-room");
  window.mNet.on("live", function () {
    var on = !!window.mNet.live();
    live.classList.toggle("on", on);
    live.setAttribute("aria-label", on ? "live" : "reconnecting");
  });
  window.mNet.on("rooms", function () {
    var many = window.mNet.manyRooms();
    room.hidden = !many;
    if (many) room.textContent = window.mNet.room() || "";
  });
  // Remembered, so the board root does not send this phone straight back. The board's "phone view" button clears it.
  document.getElementById("m-desktop").addEventListener("click", function () { try { localStorage.setItem("atrium.m.desktop", "1"); } catch (e) {} });
  window.addEventListener("m-skin", themeColor);
  window.mNet.start();
  themeColor();
})();
</script>
</body>
</html>
