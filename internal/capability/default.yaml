version: 1
caps:
  - {id: go, kind: toolchain, probe: [go, version], version: 'go(\d+\.\d+(\.\d+)?)', optional: true}
  - {id: gcc, kind: toolchain, probe: [gcc, --version], version: '(\d+\.\d+\.\d+)', optional: true}
  - {id: cmake, kind: toolchain, probe: [cmake, --version], version: '(\d+\.\d+\.\d+)', optional: true}
  - {id: ninja, kind: toolchain, probe: [ninja, --version], version: '(\d+\.\d+(\.\d+)?)', optional: true}
  - {id: make, kind: toolchain, probe: [make, --version], version: '(\d+\.\d+(\.\d+)?)', optional: true}
  - {id: vcpkg, kind: toolchain, probe: [vcpkg, version], version: '(\d{4}-\d{2}-\d{2}|\d+\.\d+(\.\d+)?)', optional: true}
  - {id: msbuild, kind: toolchain, probe: [msbuild, -version, -nologo], version: '(\d+\.\d+\.\d+(\.\d+)?)', optional: true}
  - {id: node, kind: toolchain, probe: [node, -v], version: 'v(\d+\.\d+\.\d+)', optional: true}
  - {id: docker, kind: toolchain, probe: [docker, version, --format, '{{.Server.Version}}'], optional: true}
  - {id: playwright, kind: toolchain, probe: [playwright, --version], version: '(\d+\.\d+\.\d+)', optional: true}
  - {id: python, kind: toolchain, probe: [python, --version], version: '(\d+\.\d+\.\d+)', optional: true}
  - {id: ziti, kind: toolchain, probe: [ziti, version], version: 'v?(\d+\.\d+\.\d+)', optional: true}
  - {id: zrok, kind: toolchain, probe: [zrok, version], optional: true}
  - {id: ssh, kind: toolchain, probe: [ssh, -V], version: 'OpenSSH_(\S+)', optional: true}
  - {id: wslc, kind: toolchain, probe: ['${ProgramFiles}/WSL/wslc.exe', --help], optional: true}
