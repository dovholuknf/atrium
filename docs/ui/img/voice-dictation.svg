<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1010" width="760" height="1010" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title id="t">Speech to text in atrium</title>
  <desc id="d">A board records a clip and posts it to the hub, or to a room that sends it up its link to the hub. The hub's whisper-server turns it into text and the text comes back the same way. A room uses its own whisper only when the hub cannot answer. Everything stays inside your machines.</desc>
  <defs>
    <marker id="aClip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#965C1E"/></marker>
    <marker id="aText" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6C5CB4"/></marker>
    <marker id="aFall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A87814"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#826C54" flood-opacity=".22"/></filter>
  </defs>

  <rect width="760" height="1010" rx="22" fill="#FAF5EB"/>
  <text x="380" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#241E14">Speech to text</text>
  <text x="380" y="82" text-anchor="middle" font-size="18" fill="#52483A">Your voice is transcribed on your own hub. No cloud, no hosted API.</text>

  <rect x="14" y="108" width="732" height="888" rx="22" fill="none" stroke="#B2A38A" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="34" y="94" width="150" height="28" rx="14" fill="#FAF5EB"/>
  <text x="109" y="114" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.2" fill="#6F6454">YOUR MACHINES</text>

  <!-- board A -->
  <g filter="url(#sh)">
    <rect x="30" y="150" width="300" height="130" rx="18" fill="#FFFDF8" stroke="#B2A38A" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#965C1E" stroke-width="2.4" stroke-linejoin="round" transform="translate(48 0)">
    <rect x="88" y="164" width="22" height="38" rx="5"/><path d="M96 195h6"/>
    <rect x="128" y="168" width="48" height="30" rx="4"/><path d="M144 206h16M152 198v8"/>
  </g>
  <text x="180" y="238" text-anchor="middle" font-size="21" font-weight="700" fill="#241E14">Board on the hub</text>
  <text x="180" y="262" text-anchor="middle" font-size="16" fill="#6F6454">:7778, phone or desktop</text>

  <!-- board B -->
  <g filter="url(#sh)">
    <rect x="390" y="150" width="300" height="130" rx="18" fill="#FFFDF8" stroke="#B2A38A" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#965C1E" stroke-width="2.4" stroke-linejoin="round" transform="translate(48 0)">
    <rect x="448" y="164" width="22" height="38" rx="5"/><path d="M456 195h6"/>
    <rect x="488" y="168" width="48" height="30" rx="4"/><path d="M504 206h16M512 198v8"/>
  </g>
  <text x="510" y="238" text-anchor="middle" font-size="21" font-weight="700" fill="#241E14">Board on a room</text>
  <text x="510" y="262" text-anchor="middle" font-size="16" fill="#6F6454">:7781, or /m/ through the hub</text>

  <!-- room -->
  <g filter="url(#sh)">
    <rect x="390" y="340" width="300" height="90" rx="18" fill="#F5EFE3" stroke="#B2A38A" stroke-width="2"/>
  </g>
  <text x="540" y="380" text-anchor="middle" font-size="21" font-weight="700" fill="#241E14">Room</text>
  <text x="540" y="406" text-anchor="middle" font-size="16" fill="#6F6454">sends the clip up its link</text>

  <!-- hub -->
  <g filter="url(#sh)">
    <rect x="30" y="510" width="660" height="290" rx="22" fill="#EFE0C8" stroke="#C9AC79" stroke-width="2.5"/>
  </g>
  <text x="52" y="546" font-size="22" font-weight="700" fill="#5E4415">Hub</text>
  <rect x="60" y="566" width="600" height="68" rx="14" fill="#FFFDF8" stroke="#B2A38A" stroke-width="2"/>
  <text x="360" y="596" text-anchor="middle" font-size="20" font-weight="700" fill="#241E14">Hub proxy</text>
  <text x="360" y="620" text-anchor="middle" font-size="16" fill="#6F6454">answers first, for every room</text>

  <rect x="60" y="690" width="370" height="84" rx="16" fill="#965C1E"/>
  <text x="245" y="722" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFDF8">whisper-server</text>
  <text x="245" y="750" text-anchor="middle" font-size="16" fill="#F5EFE3">large-v3-turbo q8, loopback only</text>
  <rect x="462" y="690" width="198" height="84" rx="16" fill="#FFFDF8" stroke="#C9AC79" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="561" y="722" text-anchor="middle" font-size="18" font-weight="700" fill="#241E14">or dictate_url</text>
  <text x="561" y="748" text-anchor="middle" font-size="15" fill="#6F6454">a shared server</text>

  <!-- fallback -->
  <rect x="390" y="850" width="300" height="86" rx="18" fill="#FFFDF8" stroke="#A87814" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="540" y="884" text-anchor="middle" font-size="20" font-weight="700" fill="#241E14">Room's own whisper</text>
  <text x="540" y="910" text-anchor="middle" font-size="15" fill="#6F6454">only if dictate_server is set</text>

  <!-- lane A arrows -->
  <path d="M110 280V566" fill="none" stroke="#965C1E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aClip)"/>
  <path d="M250 566V280" fill="none" stroke="#6C5CB4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aText)"/>
  <text x="124" y="412" font-size="17" font-weight="600" fill="#965C1E">clip</text>
  <text x="124" y="434" font-size="15" fill="#6F6454">WAV, POST</text>
  <text x="264" y="412" font-size="17" font-weight="600" fill="#6C5CB4">text</text>

  <!-- lane B arrows -->
  <path d="M470 280V340" fill="none" stroke="#965C1E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aClip)"/>
  <path d="M610 340V280" fill="none" stroke="#6C5CB4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aText)"/>
  <path d="M470 430V566" fill="none" stroke="#965C1E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aClip)"/>
  <path d="M610 566V430" fill="none" stroke="#6C5CB4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aText)"/>
  <text x="482" y="486" font-size="17" font-weight="600" fill="#965C1E">clip</text>
  <text x="482" y="508" font-size="15" fill="#6F6454">on the TLS link</text>
  <text x="622" y="486" font-size="17" font-weight="600" fill="#6C5CB4">text</text>

  <!-- proxy to whisper -->
  <path d="M120 634V690" fill="none" stroke="#965C1E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aClip)"/>
  <path d="M240 690V634" fill="none" stroke="#6C5CB4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aText)"/>
  <path d="M561 634V690" fill="none" stroke="#C9AC79" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#aClip)"/>

  <!-- fallback arrow, dashed -->
  <path d="M690 385H722V893H690" fill="none" stroke="#A87814" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aFall)"/>
  <text x="40" y="866" font-size="17" font-weight="600" fill="#A87814">Fallback</text>
  <text x="40" y="890" font-size="15" fill="#52483A">hub off or not answering:</text>
  <text x="40" y="912" font-size="15" fill="#52483A">the room tries its own whisper</text>

  <!-- rule + legend -->
  <rect x="40" y="952" width="330" height="32" rx="16" fill="#EFE0C8" stroke="#C9AC79" stroke-width="1.5"/>
  <text x="205" y="974" text-anchor="middle" font-size="16" font-weight="600" fill="#5E4415">One whisper per machine</text>
  <path d="M410 968H442" stroke="#965C1E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aClip)"/>
  <text x="456" y="974" font-size="16" fill="#52483A">clip</text>
  <path d="M520 968H552" stroke="#6C5CB4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aText)"/>
  <text x="566" y="974" font-size="16" fill="#52483A">text</text>
  <path d="M630 968H662" stroke="#A87814" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text x="672" y="974" font-size="16" fill="#52483A">fallback</text>
</svg>
