<style>/* tokens.css */
  /* The palette, the type and space ladders, the radii and the shadows, plus the page reset that uses them.
     Loads first because every other file in css/ reads these custom properties, and a property read before it
     is defined resolves to nothing. */
  :root {
    /* Half the palette is spelled as channels because CSS cannot take a hex and add alpha to it, and most of
       these colours are used at full strength in one place and as a tint in another. A tint written as its own
       `rgba(...)` is a second copy a skin cannot reach, so the skin repaints the solids and every tinted
       surface stays at the old hue.

       So the triple defines the colour and the solid derives from it. A skin overrides one value and both
       forms follow. A colour with no tinted use stays a plain hex. */
    --sink-rgb: 4,11,20;          /* the recess behind inputs, lists and code */
    --bg1-rgb: 7,19,34;
    --shell0-rgb: 13,33,53;
    --shell1-rgb: 8,22,37;
    --chip-rgb: 23,58,87;
    --stroke-rgb: 44,95,132;
    --stroke-dim-rgb: 37,80,111;
    --teal-rgb: 0,227,176;
    --warn-rgb: 255,198,77;
    /* THE ONE ORANGE: a live runner waiting on the operator, whoever launched it, and nothing else. A warning stays
       --warn. Held 25 degrees of hue from --warn and --teal in every skin (docs/changes/unified-card.md). */
    --wait-rgb: 255,122,26;
    --danger-rgb: 255,107,107;
    --path-rgb: 157,180,255;
    /* What a shadow is made of, which on a dark board is darker than anything the shadow falls on. */
    --shadow-rgb: 2,6,9;

    --bg-2: rgb(var(--sink-rgb));
    --bg-1: rgb(var(--bg1-rgb));
    --shell-0: rgb(var(--shell0-rgb));
    --shell-1: rgb(var(--shell1-rgb));
    --chip: rgb(var(--chip-rgb));
    --stroke: rgb(var(--stroke-rgb));
    --stroke-dim: rgb(var(--stroke-dim-rgb));
    --teal: rgb(var(--teal-rgb));
    --warn: rgb(var(--warn-rgb));
    --wait: rgb(var(--wait-rgb));
    --wait-bg: rgba(var(--wait-rgb),.13);
    --wait-stroke: rgba(var(--wait-rgb),.35);
    --danger: rgb(var(--danger-rgb));
    /* Text on a solid danger fill: the page's darkest colour on a dark skin, white on a light one (set in its block). */
    --on-danger: var(--bg-0);
    /* The blue-tinted accent a folder rule wears, so a scope reads differently from a command pattern. It has
       a name because it carries a meaning, and confusing the two is how a rule ends up wider than anyone
       agreed to. */
    --path: rgb(var(--path-rgb));

    --bg-0: #0B1B2E;
    --blue: #28C2FF;
    --card-0: #12293F; --card-1: #0A1A2B;
    --grid: #1B3B5A;
    --head: #F2F8FF; --body: #9FBDD4; --label: #7FA6C4;
    --dim: #5E819C; --dimmest: #456C88;
    /* The usage tab's by-card bars and cumulative line: the label colour at about 70%, so every skin reaches it
       through --label and none has to set it. Deliberately not a kind colour. */
    --usage-bar: color-mix(in srgb, var(--label) 70%, transparent);
    --chip-accent: #0E3D33; --chip-accent-stroke: #1C6B5A; --chip-accent-text: #8FE8D5;
    /* Where a button goes when the pointer is over it. Named so a skin can move it. */
    --btn-hover: #1D4666;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
    /* One tone for text on a danger surface. Spelling near-identical pinks out per rule gives each one a
       chance to miss the skin. */
    --danger-text: #FFC3C9;

    /* Warn and accent at the tints they are used at, so changing --warn moves every surface derived from it. */
    --warn-bg: rgba(var(--warn-rgb),.13);
    --warn-bg-soft: rgba(var(--warn-rgb),.05);
    --warn-stroke: rgba(var(--warn-rgb),.3);
    --teal-bg: rgba(var(--teal-rgb),.10);

    /* Two families and one size ladder. Every size on the page comes from here multiplied by --uiscale, so
       making the interface bigger moves all of it. Scaling one region leaves the rest at fixed pixels, which
       reads as inconsistent rather than as small. */
    --sans: Inter, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
    --uiscale: 1;
    --fs-xxs: calc(10.5px * var(--uiscale));
    --fs-xs:  calc(11.5px * var(--uiscale));
    --fs-sm:  calc(12.5px * var(--uiscale));
    --fs-base: calc(13.5px * var(--uiscale));
    --fs-md:  calc(14.5px * var(--uiscale));
    --fs-lg:  calc(16px * var(--uiscale));
    --fs-xl:  calc(18px * var(--uiscale));
    --fs-2xl: calc(20px * var(--uiscale));
    --fs-3xl: calc(23px * var(--uiscale));

    /* Space between things, scaling with the text. Padding is not on this ladder: a chip's 1px 8px and a
       dialog's 20px 22px are tuned to their own content, and bucketing them would move hit areas and break
       alignment for nothing.

       Spacing carries a second multiplier that the type ladder does not use. --uiscale moves text and space
       together, which answers "I cannot read this" and not "I want more rows on screen". Shrinking the type to
       fit more work in view makes the work harder to read, so the names stay legible and the room between them
       goes instead.

       --density is vertical only. Applied to both axes, `tightest` jammed a toolbar's controls into each other
       and clipped the labels at the left of a bar while barely moving row heights, because most of a row's
       height was hardcoded padding that was not on any ladder. So `--sp-*` is horizontal and scales with the
       text, and `--vs-*` is vertical and is the one --density moves. */
    --density: 1;
    --sp-1: calc(4px * var(--uiscale));
    --sp-2: calc(6px * var(--uiscale));
    --sp-3: calc(9px * var(--uiscale));
    --sp-4: calc(13px * var(--uiscale));
    --sp-5: calc(17px * var(--uiscale));
    --sp-6: calc(24px * var(--uiscale));

    --vs-1: calc(4px * var(--uiscale) * var(--density));
    --vs-2: calc(6px * var(--uiscale) * var(--density));
    --vs-3: calc(9px * var(--uiscale) * var(--density));
    --vs-4: calc(13px * var(--uiscale) * var(--density));
    --vs-5: calc(17px * var(--uiscale) * var(--density));
    --vs-6: calc(24px * var(--uiscale) * var(--density));

    /* A row's own padding, which is most of the height of a list. There are three because a board card, a
       stack row and a one-line history entry hold different amounts of content. */
    --row-y: calc(15px * var(--uiscale) * var(--density));
    --row-y-sm: calc(8px * var(--uiscale) * var(--density));
    --row-y-xs: calc(5px * var(--uiscale) * var(--density));
    --row-x: calc(20px * var(--uiscale));

    /* Corners do not scale. A 12px radius on a panel reads the same whatever size the text inside it is. */
    --r-xs: 3px; --r-sm: 6px; --r-md: 9px; --r-lg: 12px; --r-pill: 999px;
    /* How strongly a project group tints itself. The hue comes from the group's own name, so only the strength
       is a decision, and it is made here. Turn these up to make the blocks louder, down to make them a hint. */
    --group-fill: .22; --group-edge: .37; --card-tint: .07;
    --shadow-card: 0 10px 22px rgba(var(--shadow-rgb),.45);
    --shadow-lift: 0 16px 30px rgba(var(--shadow-rgb),.62);
    --shadow-pop: 0 14px 34px rgba(var(--shadow-rgb),.75);
    --shadow-dialog: 0 30px 70px rgba(var(--shadow-rgb),.8);

  }
  * { box-sizing: border-box; }
  /* An author rule with a display value outranks the browser's built-in [hidden] rule, so .board's
     display:grid kept the board visible on every tab. This has to win. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  /* Hold text at the size the layout asked for, on a phone as much as on a
     desktop. A mobile browser's default is `text-size-adjust: auto`, which
     inflates text it decides is too small to read: on the board it left the
     chrome alone but hit the terminal hard. xterm measures its cell from the
     computed font size of `.xterm`, and auto pushed a 14px terminal to ~20px,
     so the runner's output drew about half again too big while everything
     around it stayed put. The whole board is sized in explicit units for the
     width it is on, so there is nothing here for the heuristic to help. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* The page fills the window and never scrolls as a whole. The views that need to scroll do it inside
     themselves.

     A flex column rather than 100dvh minus a measured header. The header changes height after it is measured,
     because fonts settle, a badge appears and the nav wraps, and being two pixels over is a page scrollbar on
     every screen. */
  body {
    margin: 0; color: var(--body);
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
    font: var(--fs-xl)/1.5 Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px; opacity: .32;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
  }
  .accent-text {
    background: linear-gradient(90deg, var(--teal), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

<style>/* themes.css */
  /* The terminal theme editor, and every board skin.

     Load order is tokens, chrome, cards, sharing, notify, files, rows, terminal, dialogs, phone, themes. This
     file loads last: each `:root[data-skin=...]` block overrides the `:root` palette in `css/tokens.css`, and
     at the same specificity it only wins by coming later. The `:root` defaults live in `css/tokens.css` and the
     skin blocks live here, so anything checking that the two agree has to read both files. */

  /* ── the terminal theme editor ─────────────────────────
     The terminal's colours. The skins below are the board around it, and the
     header on that block explains the difference.

     Every colour is two controls on one line: the operating system's colour
     picker, and the hex beside it. The picker is how you nudge a green that is
     slightly too dark, and it is the only one of the two that shows you the
     colour. The hex is how you paste a value you already have, which is what
     somebody bringing a scheme they have used for years is doing. */
  .thgrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: var(--vs-2) var(--sp-3);
  }
  .thslot { display: flex; align-items: center; gap: var(--sp-2); }
  .thslot label {
    flex: 1; font-size: var(--fs-xs); color: var(--label);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* A native colour input draws its own swatch with its own padding and border,
     which at this size is mostly border. Stripped back to the swatch. */
  .thslot input[type="color"] {
    width: 30px; height: 26px; padding: 0; flex: none;
    border: 1px solid var(--stroke-dim); border-radius: 4px; background: none; cursor: pointer;
  }
  .thslot input[type="text"] {
    width: 82px; flex: none; font-family: var(--mono); font-size: var(--fs-xs);
    text-transform: lowercase;
  }
  /* A colour that is not a colour yet. The daemon would refuse it on save, and
     saying so at the box is the difference between a fix and a hunt. */
  .thslot input[type="text"].bad { border-color: var(--danger); color: var(--danger-text); }

  /* What a theme looks like without a session attached. The terminal bar's
     picker previews against real output and is better whenever there is real
     output, but a theme brought in at nine in the morning has nothing running
     yet. So this is the ansi block and a line of ordinary terminal text,
     painted from the boxes above as they change. */
  .thsample {
    font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.6;
    padding: var(--sp-3) var(--sp-4); border-radius: 8px;
    border: 1px solid var(--stroke-dim); overflow-x: auto; white-space: pre;
  }
  .thsample ::selection, .thsample::selection { background: var(--sel-bg); color: var(--sel-fg); }
  .thsample .sw { display: inline-block; width: 1.6em; text-align: center; }
  /* The shared preview: a card row over a terminal sample. The card is the board's own and does nothing when pressed. */
  .tshow { display: flex; flex-direction: column; gap: var(--vs-2); min-width: 0; }
  .tshow[hidden] { display: none; }
  .tshow-card { pointer-events: none; }
  .tshow-card .card { margin-bottom: 0; }
  .tshow-term { font-size: var(--fs-sm); line-height: 1.5; min-height: 17em; }

  /* ── skins ─────────────────────────────────────────────
     The board's own colours, not the terminal's. There are two theme systems
     in this page and confusing them is the trap. A terminal theme is sixteen
     ANSI colours plus a foreground, a background and a cursor, handed to
     `term.options.theme`, and there are fifty two of them. It belongs to one
     terminal, and two terminals side by side may reasonably differ. A skin is
     the chrome around them, and it cannot differ, because there is one board.

     Each block below moves the palette and nothing else. The type ladder, the
     space ladder, the radii and the shadow geometry are layout, and `--uiscale`
     and `--density` already answer the size question for the operator.

     The skin goes on `:root`, not on `body`. The palette derives its solids
     from its triples: `--teal` is declared as `rgb(var(--teal-rgb))`, and a
     custom property resolves against the element it is declared on, so `--teal`
     on `:root` reads `:root`'s own triple and nothing lower down can change it.
     Overriding the triples on `body` left every derived colour at the default
     while every plain hex changed: the right background with blue borders, blue
     pills and a teal accent. Moving the skin and the derivations apart brings
     that back, and it looks like a skin that is nearly right.

     Every skin declares the same set. One missing falls through to the default
     and leaves a single wrong-coloured element nobody notices for a month, so
     `scripts/check-skins.sh` counts them rather than trusting the eye.

     All ten here are dark. `--lift` and `--hairline` are white at low alpha and
     every shadow is near-black, so light needs a second set of those rather
     than a different palette, and the terminal underneath is dark whatever the
     board does. */

  /* Neutral near-black and ice cyan. The one that gets out of the way. */
  :root[data-skin="graphite"] {
    --sink-rgb: 6,8,11; --bg1-rgb: 12,15,19;
    --shell0-rgb: 22,26,32; --shell1-rgb: 14,18,23;
    --chip-rgb: 34,40,49; --stroke-rgb: 60,69,82; --stroke-dim-rgb: 44,52,63;
    --teal-rgb: 110,231,249; --warn-rgb: 245,185,59; --danger-rgb: 255,107,107;
    --path-rgb: 157,180,255; --shadow-rgb: 0,0,0;
    --bg-0: #101318; --blue: #7C9CFF; --card-0: #1A1E25; --card-1: #111419; --grid: #262C35;
    --head: #F5F7FA; --body: #B6BFCB; --label: #949FAD; --dim: #6B7583; --dimmest: #515A67;
    --chip-accent: #0F2E31; --chip-accent-stroke: #1C5257; --chip-accent-text: #93E0EA;
    --btn-hover: #2C3540; --danger-text: #FFC3C9;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* Warm charcoal and copper. Reads like a workshop rather than a console. */
  :root[data-skin="oxide"] {
    --sink-rgb: 14,10,8; --bg1-rgb: 22,16,13;
    --shell0-rgb: 33,25,20; --shell1-rgb: 24,18,14;
    --chip-rgb: 54,39,30; --stroke-rgb: 96,66,48; --stroke-dim-rgb: 71,50,37;
    --teal-rgb: 255,150,74; --warn-rgb: 245,196,80; --danger-rgb: 255,107,107;
    --path-rgb: 214,167,255; --shadow-rgb: 10,4,2;
    --bg-0: #191210; --blue: #E8A87C; --card-0: #241B16; --card-1: #16100C; --grid: #3A2A20;
    --head: #FBF4EF; --body: #CDB6A4; --label: #AC9583; --dim: #806B5C; --dimmest: #635144;
    --chip-accent: #3A2411; --chip-accent-stroke: #6B4120; --chip-accent-text: #F2C39A;
    --btn-hover: #4A3325; --danger-text: #FFC9C3;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* Forest black and lime. The only skin where the accent is louder than the
     warning. */
  :root[data-skin="moss"] {
    --sink-rgb: 5,12,8; --bg1-rgb: 8,18,13;
    --shell0-rgb: 14,30,21; --shell1-rgb: 9,21,15;
    --chip-rgb: 24,50,34; --stroke-rgb: 46,92,62; --stroke-dim-rgb: 35,70,47;
    --teal-rgb: 163,230,53; --warn-rgb: 250,204,21; --danger-rgb: 248,113,113;
    --path-rgb: 147,197,253; --shadow-rgb: 2,8,4;
    --bg-0: #0A1710; --blue: #5EEAD4; --card-0: #10241A; --card-1: #081410; --grid: #1C3A28;
    --head: #F2FBF4; --body: #A7C9B2; --label: #86AC94; --dim: #63866F; --dimmest: #4B6955;
    --chip-accent: #17330F; --chip-accent-stroke: #2E5C1C; --chip-accent-text: #C7EE8F;
    --btn-hover: #2A5238; --danger-text: #FFC9C9;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* Aubergine and orchid. Danger goes pink here so it still separates from
     the accent, which is the one thing a purple skin can get wrong. */
  :root[data-skin="plum"] {
    --sink-rgb: 12,6,16; --bg1-rgb: 19,10,26;
    --shell0-rgb: 30,17,41; --shell1-rgb: 21,12,29;
    --chip-rgb: 50,30,66; --stroke-rgb: 92,58,120; --stroke-dim-rgb: 68,43,89;
    --teal-rgb: 217,138,255; --warn-rgb: 250,204,21; --danger-rgb: 255,107,143;
    --path-rgb: 147,180,255; --shadow-rgb: 6,2,10;
    --bg-0: #150C1C; --blue: #7DD3FC; --card-0: #201430; --card-1: #120A18; --grid: #33204A;
    --head: #F9F2FF; --body: #C0AFD0; --label: #A18FB3; --dim: #7A6890; --dimmest: #5D4E70;
    --chip-accent: #2E1240; --chip-accent-stroke: #572270; --chip-accent-text: #E0B4F5;
    --btn-hover: #45276B; --danger-text: #FFC3D2;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* Brown-black and gold. The warmest, and the one that survives a bright
     room best. */
  :root[data-skin="ember"] {
    --sink-rgb: 13,9,6; --bg1-rgb: 20,14,9;
    --shell0-rgb: 31,22,14; --shell1-rgb: 22,16,10;
    --chip-rgb: 52,37,22; --stroke-rgb: 99,71,38; --stroke-dim-rgb: 73,53,29;
    --teal-rgb: 255,183,77; --warn-rgb: 255,214,102; --danger-rgb: 255,107,107;
    --path-rgb: 200,170,255; --shadow-rgb: 8,4,1;
    --bg-0: #17100A; --blue: #FFCC80; --card-0: #221810; --card-1: #140E09; --grid: #3A2A18;
    --head: #FFF7EC; --body: #D0BBA1; --label: #B09B80; --dim: #85705A; --dimmest: #665443;
    --chip-accent: #3A2708; --chip-accent-stroke: #6B4712; --chip-accent-text: #F5CE8A;
    --btn-hover: #4C3418; --danger-text: #FFC9C3;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* Cold slate and ice blue, at the highest contrast of the ten. The one to
     reach for on a laptop outdoors. */
  :root[data-skin="glacier"] {
    --sink-rgb: 8,13,18; --bg1-rgb: 13,20,27;
    --shell0-rgb: 21,32,43; --shell1-rgb: 15,23,31;
    --chip-rgb: 33,49,66; --stroke-rgb: 62,92,122; --stroke-dim-rgb: 46,69,92;
    --teal-rgb: 125,211,252; --warn-rgb: 253,224,71; --danger-rgb: 251,113,133;
    --path-rgb: 165,180,252; --shadow-rgb: 1,5,9;
    --bg-0: #0E1620; --blue: #A5B4FC; --card-0: #16222E; --card-1: #0C131A; --grid: #1F3345;
    --head: #F8FBFF; --body: #B9C9D8; --label: #98AABC; --dim: #718799; --dimmest: #566A7B;
    --chip-accent: #0C2B3A; --chip-accent-stroke: #185066; --chip-accent-text: #A5DFF5;
    --btn-hover: #2A4560; --danger-text: #FFC3CC;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* True black, one white accent, one red. For an OLED panel, and for the
     days when colour is noise. */
  :root[data-skin="noir"] {
    --sink-rgb: 0,0,0; --bg1-rgb: 8,8,8;
    --shell0-rgb: 18,18,18; --shell1-rgb: 11,11,11;
    --chip-rgb: 32,32,32; --stroke-rgb: 68,68,68; --stroke-dim-rgb: 48,48,48;
    --teal-rgb: 240,240,240; --warn-rgb: 245,197,66; --danger-rgb: 255,84,84;
    --path-rgb: 160,160,160; --shadow-rgb: 0,0,0;
    --bg-0: #0A0A0A; --blue: #C8C8C8; --card-0: #161616; --card-1: #0C0C0C; --grid: #242424;
    --head: #FFFFFF; --body: #B8B8B8; --label: #989898; --dim: #6E6E6E; --dimmest: #545454;
    --chip-accent: #1C1C1C; --chip-accent-stroke: #3C3C3C; --chip-accent-text: #E8E8E8;
    --btn-hover: #333333; --danger-text: #FFC0C0;
    --lift: rgba(255,255,255,.05); --lift-strong: rgba(255,255,255,.09); --hairline: rgba(255,255,255,.04);
  }

  /* Indigo, magenta and cyan. The loud one, and the only one where the two
     accents are a pair rather than a lead and a follow. */
  :root[data-skin="vapor"] {
    --sink-rgb: 8,6,20; --bg1-rgb: 13,10,31;
    --shell0-rgb: 22,17,48; --shell1-rgb: 15,12,34;
    --chip-rgb: 38,30,74; --stroke-rgb: 76,60,146; --stroke-dim-rgb: 56,45,108;
    --teal-rgb: 244,114,255; --warn-rgb: 250,204,21; --danger-rgb: 255,90,120;
    --path-rgb: 103,232,249; --shadow-rgb: 3,1,9;

<style>/* chrome.css */
  /* The frame around every view: the header and its tabs, the halt banner, the guest-only page, the `main`
     element, and the scrollbar styling for the whole board.

     Loads after tokens.css and before everything that draws inside main. The scrollbar block near the bottom
     is universal, so anything loaded later that wants its own bar has to say so and will win on specificity. */
  /* ── header ─────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 20;
    /* Opaque on purpose. A blurred translucent header is re-blurred every frame anything moves behind it, and
       the sound button's pulse used to keep that going at 60 fps. Every skin sets --bg1-rgb, so this reads the
       same on all of them. */
    background: rgb(var(--bg1-rgb));
    border-bottom: 1px solid var(--stroke-dim);
  }
  /* One line, always. A button that breaks across two lines reads as broken, and the header is the row people
     navigate by. The tabs give up their width first because they can scroll, and the actions on the right keep
     theirs.

     The padding answers to --density as well as --uiscale. The header is on screen in every view, so its
     height is paid on every tab. */
  .bar {
    display: flex; align-items: center; gap: var(--sp-5);
    padding: calc(11px * var(--uiscale) * var(--density)) var(--row-x);
    flex-wrap: nowrap; min-width: 0;
  }
  .bar > * { flex: none; }
  /* The tabs give up their width first, as the note above says. `.bar > *` sets
     every child to `flex: none`, which is what keeps the action buttons their
     size, but it also caught the nav and pinned it at its full content width, so
     between 900px and a wide desktop the header ran off the right edge and every
     view scrolled sideways with it. This wins on specificity and lets the nav
     shrink and scroll again, which is what its own `overflow-x: auto` is for. */
  .bar > nav { flex: 0 1 auto; min-width: 0; }

  .grow { flex: 1; }
  .conn {
    font: 500 var(--fs-xl)/1 var(--mono); color: var(--dim); display: flex; align-items: center; gap: var(--sp-3);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .conn.live .dot { background: var(--teal); box-shadow: 0 0 9px var(--teal); }
  /* Down, the chip is a pill in the room chip's shape, in smaller type than the live chip: the header is
     already full at a laptop's width, and `reconnecting` is a long word. The dot breathes, because something
     is happening. */
  .conn.down {
    font-size: var(--fs-sm); color: var(--danger-text); white-space: nowrap;
    padding: 6px 12px; border-radius: var(--r-pill);
    border: 1px solid rgba(var(--danger-rgb),.55); background: rgba(var(--danger-rgb),.12);
  }
  .conn.down .dot {
    width: 8px; height: 8px; box-shadow: 0 0 0 0 rgba(var(--danger-rgb),.6);
    animation: conn-breathe 1.6s ease-out 5;
  }
  @keyframes conn-breathe {
    0% { box-shadow: 0 0 0 0 rgba(var(--danger-rgb),.6); }
    100% { box-shadow: 0 0 0 7px rgba(var(--danger-rgb),0); }
  }

  /* ── changing rooms ─────────────────────────────────────
     A reload shows the view the markup says (the stack) and then the script puts you back on the one you were
     reading, so a switch made from the terminals meant watching somebody else's screen draw on the way past.
     `html.switching` is set by an inline script in the head, before the first paint, so the board underneath is
     never seen mid-change. Removed once the board is on the right view. */
  #switching { display: none; }
  html.switching #switching {
    display: flex; position: fixed; inset: 0; z-index: 500;
    align-items: center; justify-content: center;
    background: var(--bg-1);
  }
  /* The board is not merely covered, it is not drawn. A cover over a live board still lets a terminal attach,
     a poll land and a pane repaint underneath, which is work thrown away and, on a slow machine, a cover that
     arrives after the flash it was meant to hide. */
  html.switching body > header,
  html.switching body > main { visibility: hidden; }
  /* The card itself is the wait family's. See `.waitcard` in css/dialogs.css. */
  #switching .s-what b { color: var(--teal); font-weight: 600; }

  /* ── which room ─────────────────────────────────────────
     Only ever drawn on a hub, which is an atrium that serves this board and holds nothing. It reads as a
     counter and behaves as a selector: `2/2 rooms` is every machine at once, a name is one machine and the
     whole board is that machine's atrium.

     Sits beside the connection dot and is styled like it, because they answer neighbouring questions: one says
     whether the board is live, the other says what it is live to. */
  .rooms {
    font: 500 var(--fs-xl)/1 var(--mono); color: var(--dim); cursor: pointer;
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 5px 11px; border-radius: var(--r-pill);
    border: 1px solid var(--stroke-dim); background: var(--chip);
  }
  .rooms:hover { color: var(--head); border-color: var(--stroke); }
  .rooms-all { font: 500 var(--fs-xl)/1 var(--mono); padding: 5px 11px; border-radius: var(--r-pill); cursor: pointer; }
  .rooms-all[hidden] { display: none; }
  .rooms .dot { background: var(--teal); box-shadow: 0 0 9px var(--teal); }
  /* Scoped to one room, which is a mode worth seeing from across the desk. */
  .rooms.scoped { color: var(--teal); border-color: var(--teal); }
  /* Nothing attached. The hub is up and has nothing to show, which is a normal state every time a room
     restarts and must not look like the board being broken. */
  .rooms.cold .dot { background: var(--warn); box-shadow: none; }
  /* The board lost the hub. This chip is the only connection indicator on a hub, so it has to be able to say
     so: a green counter beside a red `reconnecting` was two controls contradicting each other. */
  /* Attached rooms set up differently (missing hooks, another build). The tooltip names each. */
  .rooms.warn { color: var(--warn); border-color: var(--warn); }
  .rooms.warn .dot { width: auto; height: auto; background: none; box-shadow: none; border-radius: 0; }
  .rooms.warn .dot::before { content: "\26A0\FE0E"; font-size: var(--fs-xl); line-height: 1; }
  #setuppop {
    position: fixed; z-index: 400; width: max-content; max-width: calc(100vw - 16px); max-height: 80vh; overflow: auto;
    padding: 10px 14px; user-select: text; white-space: nowrap; font-size: calc(var(--fs-sm) * 1.2);
    background: var(--shell-0); color: var(--body); border: 1px solid var(--stroke); border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
  }
  #setuppop[hidden] { display: none; }
  /* One grid for the whole popover so the room names are one column and every mark lines up under the last. */
  #setuppop { display: grid; grid-template-columns: max-content max-content 1fr; column-gap: 10px; align-items: baseline; }
  #setuppop[hidden] { display: none; }
  #setuppop h5 { margin: 0; font: 600 1em/1.5 var(--mono); color: var(--head); text-align: left; }
  #setuppop .rm { display: contents; }
  #setuppop .rm b { font-weight: 400; }
  #setuppop .rm.bad b, #setuppop .rm.bad span { color: var(--warn); }
  #setuppop .ok { color: var(--body); }
  #setuppop .it { grid-column: 2 / 4; display: flex; gap: 8px; align-items: baseline; font: 400 1em/1.5 var(--sans); color: var(--body); }
  #setuppop .it.bad { color: var(--warn); }
  #setuppop .it .tx { flex: 1; }
  #setuppop .it .setuppick { flex: none; width: 1em; margin: 0; }
  #setuppop .it .why { flex: none; margin-left: 16px; color: var(--dim); font-style: italic; }
  #setuppop .setupall { grid-column: 1 / -1; margin-top: 10px; }
  #setuppop .it .k { flex: none; font-family: var(--mono); opacity: .8; }
  #setuppop .setupfix { margin-left: 16px; padding: 1px 8px; }  .setupline { display: flex; align-items: center; gap: var(--sp-3); margin-top: 6px; }
  .setupline .chip.warn { color: var(--warn); border-color: var(--warn); }
  .rooms.down { color: var(--danger-text); border-color: var(--danger); }
  .rooms.down .dot { background: var(--danger); box-shadow: none; }
  /* Fixed and body-level, positioned by script from the chip. See the note on the element itself: the header
     is a stacking context, so a menu inside it cannot be lifted above the page. */
  .rooms-menu {
    position: fixed; z-index: 90; min-width: 19rem;
    /* A panel of room tiles rather than a list of names, so it is sized like one, and never wider than the
       window. It scrolls inside itself: openRooms sets its height from the chip down. */
    width: min(36rem, calc(100vw - 16px)); overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2);
    border: 1px solid var(--stroke); border-radius: var(--r-md);
    /* --shell-0 and not --bg-1, which is the page. A popover wants the panel colour, and it is the same one
       #cardmenu uses so the two look like the same kind of thing. An undefined token here resolves to
       transparent, which reads as a z-index fault: the border and the text draw, and the page shows through. */
    background: var(--shell-0); border: 1px solid var(--stroke);
    box-shadow: 0 14px 40px rgba(var(--shadow-rgb),.55);
  }
  /* `display: flex` above beats the browser's own `[hidden] { display: none }`, because an author rule wins
     over the user agent one whatever the specificity. Without this the menu is never closed. */
  .rooms-menu[hidden] { display: none; }
  /* One line per room: a state dot, the name, and the meta pushed to the right.
     The dot carries the state the way the header chip does, so live and offline
     read at a glance from the same colours. */
  .rooms-menu button {
    display: flex; flex-direction: row; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4); border: 0; border-radius: var(--r-sm);
    background: none; color: var(--body); text-align: left; cursor: pointer;
    transition: background .12s;
  }
  .rooms-menu button:hover { background: var(--chip); }
  .rooms-menu button.on { color: var(--teal); background: var(--teal-bg); }
  .rooms-menu button strong { font: 600 var(--fs-lg)/1.3 var(--mono); }
  /* Live is teal and lit, the same green the pill uses. Offline is a flat amber,
     also the pill's, so the two states are one language across the header. */
  .rooms-menu button .dot { width: 8px; height: 8px; flex: none; background: var(--warn); box-shadow: none; }
  .rooms-menu button .dot.live { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .rooms-menu button .dot.ghost { background: transparent; box-shadow: none; }
  /* A disconnected room. Dimmed so the live ones read first, but still a button:
     the board shows what an offline room last said, so it stays selectable. */
  .rooms-menu button.cold strong { color: var(--dim); }
  .rooms-menu button .meta {
    margin-left: auto; padding-left: var(--sp-4);
    font: 500 var(--fs-sm)/1 var(--mono); color: var(--dim); white-space: nowrap;
  }
  .rooms-menu .none { padding: var(--sp-4); font-size: var(--fs-sm); color: var(--dim); line-height: 1.5; }
  /* The reject affordance on a not-attached row. Dim until the row is hovered,
     so it is out of the way of the ordinary click and there to reach for when
     wanted. It carries its own hover so the target it hits is obvious, and it
     turns danger-coloured because forgetting a room is the destructive one. */
  .rooms-menu button .roomx {
    flex: none; margin-left: var(--sp-2); width: 1.25rem; height: 1.25rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm); font: 600 var(--fs-lg)/1 var(--mono);
    color: var(--dim); opacity: 0; transition: opacity .12s, background .12s, color .12s;
  }
  .rooms-menu button:hover .roomx { opacity: .7; }
  .rooms-menu button .roomx:hover { opacity: 1; color: var(--danger); background: var(--chip); }
  /* The per-room settings cog on a live row. Sits at the right edge after the host meta, and unlike the reject
     `x` it stays visible rather than waiting on hover: it is the quick way into one room's own settings, not a
     rare destructive action. Dim at rest so the room name reads first, and it lifts on hover like a control. */
  .rooms-menu button .roomcog {
    flex: none; margin-left: var(--sp-2); width: 1.25rem; height: 1.25rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm); font: 600 var(--fs-lg)/1 var(--mono);
    color: var(--dim); opacity: .55; transition: opacity .12s, background .12s, color .12s;
  }
  .rooms-menu button:hover .roomcog { opacity: .85; }
  .rooms-menu button .roomcog:hover { opacity: 1; color: var(--teal); background: var(--chip); }

  /* ── the room tiles, from js/rooms-dash.js ──────────────────────────────────────────────────────────────
     One tile per room, three bands side by side, stacked at phone width. Every colour is a skin variable, so a
     light skin gets light tiles without a rule of its own. */
  .rtile {
    display: flex; flex-direction: column; gap: var(--sp-2);
    padding: var(--sp-3); border-radius: var(--r-md); cursor: pointer; text-align: left;
    border: 1px solid var(--stroke-dim); background: var(--card-1); color: var(--body);
    transition: border-color .15s, background .15s;
  }
  .rtile:hover { border-color: var(--stroke); background: var(--card-0); }
  .rtile:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .rtile.on { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal-bg); }
  .rtile.all { background: var(--shell-1); }
  .rtile .rt-head { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
  .rtile .rt-head > * { flex: none; }
  .rtile .rt-head strong { font: 600 var(--fs-lg)/1.2 var(--mono); color: var(--head); }
  .rtile.on .rt-head strong { color: var(--teal); }
  /* The meta gives way first, with an ellipsis, so the badges and the cog stay on the one line. */
  .rtile .rt-head > .rt-meta {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 500 var(--fs-sm)/1.2 var(--mono); color: var(--dim);
  }
  .rtile .rt-head .grow { display: none; }
  .rtile .rt-head .chip { font-size: var(--fs-xs); }
  .rtile .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; }
  .rtile .dot.live { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .rtile .dot.ghost { background: transparent; border: 1px solid var(--dim); }
  .rtile .roomcog {
    flex: none; width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm); font: 600 var(--fs-lg)/1 var(--mono); color: var(--dim); opacity: .6;
    transition: opacity .12s, background .12s, color .12s;
  }
  .rtile:hover .roomcog { opacity: .9; }
  .rtile .roomcog:hover { opacity: 1; color: var(--teal); background: var(--chip); }

  .rt-bands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
  .rd-band {
    display: flex; flex-direction: column; gap: 3px; min-width: 0;
    padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
    background: var(--bg-2); border: 1px solid var(--hairline);
    font: 500 var(--fs-sm)/1.35 var(--mono); color: var(--body); text-align: left;
  }
  .rd-h { font: 600 var(--fs-xxs)/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--label); }
  .rd-sub { font: 500 var(--fs-xxs)/1.4 var(--mono); color: var(--dim); margin-top: 3px; }
  .rd-row { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; min-width: 0; }
  .rd-row b { font-weight: 600; color: var(--head); font-variant-numeric: tabular-nums; }
  .rd-row b.rd-big { font-size: var(--fs-md); }
  .rd-dim { color: var(--dim); }
  .rd-dim span { color: var(--label); }
  .rd-dash { color: var(--dimmest); }
  .rd-warn, .rd-warn b { color: var(--warn); }
  .rd-rate { flex-wrap: nowrap; align-items: center; }
  .rd-rate > span { flex: none; }

  /* Needs you is the one number that asks for a person, so it wears the waiting colour and is a control. */
  .rd-need b { color: var(--dim); }
  .rd-need.on { color: var(--warn); cursor: pointer; border-radius: var(--r-xs); padding: 0 3px; margin: 0 -3px; }
  .rd-need.on b { color: var(--warn); }
  .rd-need.on:hover { background: var(--warn-bg); }
  .rd-kinds { gap: var(--sp-2); color: var(--label); font-size: var(--fs-xs); }
  .rd-kinds i { font-style: normal; color: var(--dimmest); }
  .rd-kinds .off { color: var(--dimmest); text-decoration: line-through; }

  /* Sparklines: a polyline and a faint fill under it, stretched to the band, the stroke kept at one width. */
  .rd-spark { flex: 1 1 auto; min-width: 0; height: 1.25rem; display: block; overflow: visible; }
  .rd-spark.none { height: 1px; background: var(--hairline); align-self: center; }
  .rd-spark polyline { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .rd-spark .area { stroke: none; opacity: .14; }
  .rd-spark.tok polyline { stroke: var(--teal); }
  .rd-spark.tok .area { fill: var(--teal); }
  .rd-spark.cpu polyline { stroke: var(--blue); }
  .rd-spark.cpu .area { fill: var(--blue); }
  /* u-034: memory's own colour, through a variable a skin can set. A one-point run is a dot, so the cap is round. */
  .rd-spark.mem polyline { stroke: var(--spark-mem, #b48cff); }
  .rd-spark.mem .area { fill: var(--spark-mem, #b48cff); }
  .rd-spark.lag polyline { stroke: var(--warn); }
  .rd-spark.lag .area { fill: var(--warn); }
  .rd-rate.hot .rd-spark.lag polyline { stroke: var(--danger); }
  .rd-rate.hot .rd-spark.lag .area { fill: var(--danger); }
  .rd-spark polyline { stroke-linecap: round; }
  .rd-note { color: var(--dim); font-size: var(--fs-xs); }
  .rd-stale { opacity: .55; }
  .rd-stale .rd-note:last-child { color: var(--warn); }
  .rd-rate.hot .rd-spark.cpu polyline { stroke: var(--danger); }
  .rd-rate.hot .rd-spark.cpu .area { fill: var(--danger); }
  .rd-rate.hot b { color: var(--danger-text); }

  /* The limit bars. What a card last said, labelled so, coloured by how close it is to the line. */
  .rd-limits { display: flex; flex-direction: column; gap: 2px; }
  .rd-lim { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); }
  .rd-lim .k { flex: none; width: 2.6em; color: var(--label); }
  .rd-lim .v { flex: none; min-width: 2.6em; text-align: right; color: var(--head); font-variant-numeric: tabular-nums; }
  .rd-bar { flex: 1; height: 5px; border-radius: var(--r-pill); background: var(--chip); overflow: hidden; }
  .rd-bar i { display: block; height: 100%; border-radius: inherit; background: var(--teal); transition: width .4s ease; }
  .rd-lim.warm .rd-bar i { background: var(--warn); }
  .rd-lim.hot .rd-bar i { background: var(--danger); }
  .rd-lim.hot .v { color: var(--danger-text); }

  /* A number that changed fades in over its old value, which fades out on top of it. */
  .rd-fade { position: relative; animation: rd-in .7s ease-out; }
  .rd-fade::after {
    content: attr(data-was); position: absolute; left: 0; top: 0; white-space: nowrap;
    pointer-events: none; animation: rd-out .7s ease-out forwards;
  }
  @keyframes rd-in { from { opacity: .15; } to { opacity: 1; } }
  @keyframes rd-out { from { opacity: .8; } to { opacity: 0; visibility: hidden; } }

  /* A slow pulse on a tile with somebody waiting or a CPU past 90%. Slow enough to be seen from across the
     desk and never read as an alarm. */
  .rtile.hot { animation: rd-pulse 2.8s ease-in-out 3; }
  @keyframes rd-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--warn-rgb), 0); border-color: var(--stroke-dim); }
    50% { box-shadow: 0 0 0 3px rgba(var(--warn-rgb), .18); border-color: var(--warn-stroke); }
  }
  .rtile.hot.on { animation-name: rd-pulse-on; }
  @keyframes rd-pulse-on {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--warn-rgb), 0); }
    50% { box-shadow: 0 0 0 3px rgba(var(--warn-rgb), .18); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rtile.hot { animation: none; border-color: var(--warn-stroke); }
    .rd-fade, .rd-fade::after { animation: none; }
    .rd-fade::after { content: none; }
    .rd-bar i { transition: none; }
  }

  /* The disconnected rooms, below the tiles and dimmed, one line each with their `x`. */
  .rtile-offs { display: flex; flex-direction: column; border-top: 1px solid var(--hairline); padding-top: var(--sp-2); }
  .rooms-menu button.rtile-off { opacity: .8; }

  /* Phone: one tile per row, the bands stacked, the sparklines kept. */
  @media (max-width: 640px) {
    .rt-bands { grid-template-columns: minmax(0, 1fr); }
    .rd-band { flex-direction: column; }
    .rtile .rt-head { flex-wrap: wrap; }
  }

  /* WHICH MACHINE THESE ARE ON, said once above them instead of on every row.
     A runner, a fixture, a source, a recogniser and an action all belong to one machine, so looking at several
     machines means several lists rather than one long one with a repeated label near the right edge. The
     heading is the boundary and the boundary is the point. */
  .roomgroup {
    margin: var(--vs-4) 0 var(--sp-3);
    font: 600 var(--fs-md)/1 var(--mono); color: var(--teal);
    letter-spacing: .08em; text-transform: lowercase;
  }
  /* The first one sits under the pane's own lead text, which has already paid for the space. */
  .roomgroup:first-child { margin-top: 0; }

  #halted {
    display: none; padding: 13px 26px; gap: var(--sp-4); align-items: baseline;
    background: linear-gradient(90deg, rgba(var(--danger-rgb),.18), rgba(var(--danger-rgb),.04));
    border-bottom: 1px solid var(--danger); color: var(--danger-text); font-size: var(--fs-md);
  }
  #halted strong { color: var(--danger); letter-spacing: .1em; text-transform: uppercase; font-size: var(--fs-sm); }
  #halted code { font-family: var(--mono); font-size: var(--fs-sm); color: var(--danger-text); }

  /* The whole page, for a share opened without its fragment. `body.guestonly` takes the board away rather than
     leaving it empty behind this, because an empty board reads as a second copy of your own. */
  #guestonly {
    max-width: 46rem; margin: 12vh auto 0; padding: 0 var(--sp-5);
    color: var(--body); font-size: var(--fs-md); line-height: 1.6;
  }
  #guestonly strong {
    display: block; color: var(--teal); letter-spacing: .1em; text-transform: uppercase;
    font-size: var(--fs-sm); margin-bottom: var(--sp-3);
  }
  #guestonly p { margin: 0 0 var(--sp-4); }
  #guestonly .guest-how { color: var(--dim); font-size: var(--fs-sm); }
  #guestonly code { font-family: var(--mono); font-size: var(--fs-sm); color: var(--head); }
  body.guestonly header,
  body.guestonly main,
  body.guestonly #halted { display: none !important; }

  /* Full width, with no cap. A cap left a third of a wide screen empty while a diff scrolled inside a box.

     main never scrolls. The view inside it does. A scrollbar on main is drawn inside main's padding, over the
     right edge of whatever is showing, which put it on top of the terminal.

     min-height:0 is what lets main shrink at all. A flex item defaults to its content's height, which pushes
     the page taller than the window.

     It is a flex column as well as a flex item. The board asked for 100% of main and then sat below the group
     bar and inside main's padding, so the total was taller by the bar plus the padding. A percentage height
     cannot see its siblings and flex can. */
  main {
    position: relative; z-index: 1; padding: 20px 26px;
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* The views that fill what is left. Everything else in main keeps its own height. */
  main > .board,
  main > #stack,
  main > #perms,
  main > #runners,
  main > #audit,
  main > #chatter,
  main > #history,
  main > #usage,
  main > #terms { flex: 1 1 auto; min-height: 0; }
  /* The ones that can be taller than the window scroll themselves. The board scrolls per lane and the terminal
     never scrolls, so neither is here. */
  main > #perms,
  main > #runners { overflow-y: auto; overflow-x: hidden; }
  /* The stack scrolls its list rather than itself, so the filter pills, sort pills and search box stay on
     screen once there are enough cards to scroll. Inside the scroll box they left the top of the screen
     exactly when the list got long enough to need them, and the scrollbar ran up past them as well. */
  main > #stack {
    display: flex; flex-direction: column; overflow: hidden; gap: 0;
  }
  #stack > .filters { flex: 0 0 auto; }
  #stack > #stack-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  /* The backlog the same way: its view bar and the header row stay put and the list scrolls, with the reports under it scrolling on their own. */
  main > #backlog { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

<body>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Copied from js/walk.js: walkWordSpan, walkWords, walkFileText, walkForgeName, and the markup of filePane.
function walkWordSpan(a, b) {
  let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  return { a: [s, ea], b: [s, eb] };
}
function walkWords(lines) {
  const out = new Map();
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].t !== "-" || (i && lines[i - 1].t === "-")) continue;
    let d = i; while (d < lines.length && lines[d].t === "-") d++;
    let a = d; while (a < lines.length && lines[a].t === "+") a++;
    if (a - d !== d - i) continue;
    for (let k = 0; k < d - i; k++) {
      const w = walkWordSpan(lines[i + k].text, lines[d + k].text);
      if (w.a[0] === 0 && w.a[1] === lines[i + k].text.length && w.b[1] === lines[d + k].text.length) continue;
      out.set(i + k, w.a); out.set(d + k, w.b);
    }
  }
  return out;
}
function walkFileText(text, span) {
  if (!span || span[0] >= span[1]) return esc(text) || "&nbsp;";
  return esc(text.slice(0, span[0])) + `<mark class="wk-w">${esc(text.slice(span[0], span[1]))}</mark>` + esc(text.slice(span[1]));
}
function walkForgeName(url) {
  const h = new URL(url).hostname.toLowerCase();
  if (h === location.hostname || h === "localhost" || h === "127.0.0.1") return "the local hub";
  if (h === "github.com") return "GitHub";
  if (h.includes("gitlab")) return "GitLab";
  if (h.includes("bitbucket")) return "Bitbucket";
  return h;
}
function parse(text) {
  const out = []; let f = null, n = 0, o = 0;
  for (const l of text.split("\n")) {
    const g = /^diff --git a\/(.+?) b\/(.+)$/.exec(l);
    if (g) { f = { path: g[2], from: g[1], status: "modified", add: 0, del: 0, lines: [], inHunk: false }; out.push(f); continue; }
    if (!f) continue;
    const h = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(l);
    if (h) { o = +h[1]; n = +h[2]; f.inHunk = true; f.lines.push({ t: "@", n: null, text: l }); continue; }
    if (!f.inHunk) { if (l.startsWith("Binary")) f.status = "binary"; continue; }
    if (l.startsWith("+")) { f.add++; f.lines.push({ t: "+", n: n++, o: null, text: l.slice(1) }); }
    else if (l.startsWith("-")) { f.del++; f.lines.push({ t: "-", n: null, o: o++, text: l.slice(1) }); }
    else if (l.startsWith(" ")) f.lines.push({ t: " ", n: n++, o: o++, text: l.slice(1) });
  }
