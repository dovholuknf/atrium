<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design B: file list, then change cards</title>
<!-- Design B: "file list first" combined with "summary first" cards and stacked before/after.
     Why: on a 412px screen a unified diff spends two gutter columns on line numbers and interleaves -/+ lines that
     are nearly identical, so the eye hunts for the changed words across wrapped rows. Here the page opens on a file
     list (name, counts, a thin green/red bar), so a 6-file commit is one glance and one tap per file. Inside a file,
     each hunk is a card with the changed lines plus 2 lines of context, and no gutter columns, so code uses the full
     width. "Show full hunk" expands the card. Because deletions come first and additions second, a changed pair reads
     as before then after, with the changed words marked in both. The line number shows only after a tap, in the bar. -->
<style>

  --addbg:#12261e; --addmk:#1f6f3a; --delbg:#2d1517; --delmk:#8e2a30; --hunk:#121d2f; --hunkfg:#79c0ff; --sel:#3d3515;
  --add:#3fb950; --del:#f85149; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; padding-bottom: 96px;
  -webkit-text-size-adjust: 100%; }
.code { font: var(--m-fs)/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
mark { background: var(--addmk); color: inherit; border-radius: 2px; }
.del mark { background: var(--delmk); }
body .code.sel { background: var(--sel); outline: 2px solid #d4a72c; outline-offset: -2px; }
.top { position: sticky; top: 0; z-index: 3; background: var(--hdr); border-bottom: 1px solid var(--line); padding: 8px 12px; }
.top b { display: block; } .top span { color: var(--mut); font-size: 12px; overflow-wrap: anywhere; }
.cnt .a { color: var(--add); } .cnt .d { color: var(--del); }
#bar { position: fixed; left: 0; right: 0; bottom: 52px; background: var(--hdr); border-top: 1px solid var(--line);
  padding: 4px 12px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--mut); z-index: 4; }
#composer { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; background: var(--bg);
  border-top: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; z-index: 4;
  font-size: 15px; }
#quote.has { background: var(--hunk); color: var(--hunkfg); border-radius: 4px; padding: 2px 4px;
  font-family: ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.caret { width: 1px; height: 18px; background: var(--fg); } .ph { color: var(--mut); flex: 1; }
#quote.has ~ .ph { display: none; }
#composer button { margin-left: auto; border: 0; background: #1f6feb; color: #fff; border-radius: 6px; padding: 8px 14px; }

.fl { display: block; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.fl .r { display: flex; gap: 8px; align-items: baseline; }
.fl .p { flex: 1; font: 600 13px ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
.bar { display: flex; height: 4px; margin-top: 6px; border-radius: 2px; overflow: hidden; }
.bar i:first-child { background: var(--add); } .bar i:last-child { background: var(--del); }
.fl .st { color: var(--mut); font-size: 12px; }
.back { padding: 8px 12px; color: var(--hunkfg); border-bottom: 1px solid var(--line); background: var(--hdr); font-size: 13px; }

.card .lab { background: var(--hunk); color: var(--hunkfg); font: 11px ui-monospace, Menlo, Consolas, monospace;
  padding: 3px 8px; display: flex; justify-content: space-between; gap: 8px; }
.row { padding: 2px 8px 2px 22px; position: relative; }

.row.add::before { color: var(--add); } .row.del::before { color: var(--del); } .row.ctx { color: var(--mut); }
.more { padding: 6px 8px; font-size: 12px; color: var(--hunkfg); border-top: 1px solid var(--line); background: var(--hdr); }
.bin { padding: 10px 12px; color: var(--mut); }
</style></head><body>

    const w = (f.add + f.del) / mx * 100, pa = f.add + f.del ? f.add / (f.add + f.del) * 100 : 0;
    a.innerHTML = '<div class="r"><span class="p">' + esc(f.path) + '</span><span class="cnt"><span class="a">+' + f.add +
      '</span> <span class="d">-' + f.del + '</span></span></div><div class="st">' + (f.binary ? "binary" : f.status) +
      '</div><div class="bar" style="width:' + Math.max(w, 8) + '%"><i style="width:' + pa + '%"></i><i style="width:' +
      (100 - pa) + '%"></i></div>';
    a.onclick = () => open(f); root.appendChild(a);
  }
}
// Keep changed lines plus CTX lines around them; the rest of the hunk hides behind a tap.
function visible(h) {
  const out = h.lines.map(l => l.t !== " ");
  h.lines.forEach((l, i) => {
    if (l.t !== " ") for (let d = -CTX; d <= CTX; d++) if (i + d >= 0 && i + d < out.length) out[i + d] = true;
  });
  return out;
}
function open(f) {
  window.scrollTo(0, 0);
  document.getElementById("sum").textContent = f.path;
  root.innerHTML = '<div class="back">&#8249; All files</div>'; root.firstChild.onclick = list;
  if (f.binary) root.insertAdjacentHTML("beforeend", '<div class="bin">Binary file, not shown</div>');
  for (const h of f.hunks) {
    const card = document.createElement("div"); card.className = "card";
    const vis = visible(h); let full = false;
    const render = () => {
      card.innerHTML = '<div class="lab"><span>' + esc(h.ctx || "hunk") + '</span><span>' +
        esc(h.head.replace(/ @@.*/, " @@")) + '</span></div>';
      let hidden = 0;
      h.lines.forEach((l, i) => {
        if (!full && !vis[i]) { hidden++; return; }
        const r = document.createElement("div");
        r.className = "row code " + (l.t === "+" ? "add" : l.t === "-" ? "del" : "ctx");
        r.dataset.m = l.t === " " ? "" : l.t;
        r.innerHTML = l.html; r.onclick = () => pick(r, f.path, l.n ?? l.o);
        card.appendChild(r);
      });
      if (hidden) {
        const m = document.createElement("div"); m.className = "more";
        m.textContent = "Show full hunk (" + hidden + " more lines)";
        m.onclick = () => { full = true; render(); }; card.appendChild(m);
      }
    };
    render(); root.appendChild(card);
  }
}
list();
// ?open=N goes straight into file N (used for the screenshots).
const op = new URLSearchParams(location.search).get("open");
if (op !== null) open(files[+op]);
</script></body></html>
