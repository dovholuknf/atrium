version: 2
multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/ci-run
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
  - package-ecosystem: gomod
    directories:
      - /
      - /website
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
  - package-ecosystem: npm
    directories:
      - /
      - /website
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
