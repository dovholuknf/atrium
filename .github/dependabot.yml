version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly
    pull-request-branch-name:
      separator: "-"
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/ci-run
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: gomod
    directories:
      - /
      - /website
    patterns: ["*"]
    multi-ecosystem-group: all
  - package-ecosystem: npm
    directories:
      - /
      - /website
    patterns: ["*"]
    multi-ecosystem-group: all
