# Make a release: call this with a version. All the logic is scripts/make-release.sh, which also runs by hand.
#
# The version commit (scripts/make-release.sh prepare, run by hand) is already on main by a normal merge. tag checks that
# main's head has that VERSION, the tag is new and ci.yml succeeded on that exact sha, then tags it, and refuses at once
# otherwise. publish calls release.yml, because a tag pushed with GITHUB_TOKEN does not fire release.yml's tag trigger.

name: make-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, MAJOR.MINOR.PATCH, such as 0.0.6"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: bash scripts/make-release.sh tag "$VERSION" --execute

  publish:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      version: v${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
