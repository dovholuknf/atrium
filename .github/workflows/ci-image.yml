# Builds and pushes the image the ubuntu jobs in ci.yml run in. No logic here: scripts/ci-image.sh does it.
name: ci-image

on:
  push:
    branches: ["**"]
    paths:
      - .github/ci-image/**
      - scripts/ci-image.sh
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci-image.sh --push
