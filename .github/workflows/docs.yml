# Build the docs site and publish it to GitHub Pages.
#
# THERE IS NO LOGIC IN THIS FILE. Everything it does lives in `scripts/build-docs.sh`, which runs on a developer's
# machine exactly as it runs here. This file checks out, installs node, asks Pages where the site lives, calls the
# script with those values, and hands the output folder to the Pages actions.
#
# It runs on a push to main that touches the site, the docs, this file or the build script, and by hand.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "scripts/build-docs.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - name: build
        shell: bash
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: ./scripts/build-docs.sh --url "$PAGES_ORIGIN" --base-url "$PAGES_BASE_PATH" --out-dir "$PWD/website/build"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
