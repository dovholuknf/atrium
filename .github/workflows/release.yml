# Cut the release for a tag that was just pushed.
#
# THERE IS NO LOGIC IN THIS FILE. One script, `scripts/cut-release.sh`, which
# was run by hand on the machine that wrote it long before this ever ran here.
# It builds five platforms, packages the Linux two, checks the binary agrees
# with the tag, rebuilds the commit in a clean directory to prove nothing else
# reached the compiler, verifies every hash, writes the scoop manifest, and
# publishes.
#
# THE GITHUB-SPECIFIC VALUES ENTER AS PARAMETERS AND NOTHING ELSE: the tag as an
# argument, the token in the environment. That is the whole of what this file
# adds, which is the convention every script in scripts/ is written to allow. A
# release path that only exists inside a YAML file can only ever be debugged by
# cutting a release.
#
# `--from-tag` is what makes the same script correct in both places. Run by
# hand, it refuses a tag that already exists and creates the one you named. Run
# here, the tag exists already because pushing it is what started this, so it
# builds what the tag names and checks the tag really is the commit checked out.
#
# TRIGGERED BY A TAG, NEVER BY A BRANCH. A release is a decision somebody made
# by typing `git tag`.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "tag to publish, which must already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The tag, from whichever of the two triggers fired. Expressed here rather
      # than repeated in the `run:` line, because a version computed twice is a
      # version that will eventually be computed differently.
      ATRIUM_VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and every tag. cut-release.sh checks that the tag
          # exists and points at HEAD, and a shallow clone with no tags cannot
          # answer either question.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A checkout has a clean tree and every refusal is fast, so this costs
      # nothing and turns "the tag is not what is checked out" into a failure
      # before twenty minutes of building.
      - name: what would stop this
        run: bash scripts/cut-release.sh "$ATRIUM_VERSION" --from-tag --preflight

      # ci.yml already ran on the commit, so --skip-ci is the one waiver taken
      # here and it is taken on purpose. Every other refusal is a fact about the
      # artefact and cannot be waived at all.
      - name: build, prove, and publish
        run: bash scripts/cut-release.sh "$ATRIUM_VERSION" --from-tag --skip-ci --execute

      # Kept whether or not the publish worked. When it did, this is how you
      # check a hash without downloading a release. When it did not, it is the
      # only copy of what was built, including the scoop manifest, which is the
      # file a human has to carry to the bucket repository by hand.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atrium-${{ env.ATRIUM_VERSION }}
          path: build.claude/release/${{ env.ATRIUM_VERSION }}/
