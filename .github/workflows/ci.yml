# Check out, install the two toolchains, call one script.
#
# THERE IS NO LOGIC IN THIS FILE and there must never be. Everything it checks
# lives in `scripts/ci.sh`, which runs on a developer's machine exactly as it
# runs here. A check that exists only inside a YAML file can only be debugged by
# pushing, and every push to debug it is a five minute round trip to discover a
# quoting mistake.
#
# The two `setup-` steps are the exception the rule allows: they are how a
# runner acquires a toolchain and they are GitHub-specific by nature. They
# configure the environment. They do not decide anything. So is the upload at
# the end, which carries off the files ci.sh wrote and decides nothing either.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # THE FLAKY SUITE FIRST, ONE JOB PER PLATFORM. scripts/flaky-suite.json lists the tests known to fail now and then, and
  # `ci.sh --group flaky` runs only those. Each platform's other jobs wait for that platform's flaky job (`needs`), and
  # run whether it passed or not (`!cancelled()`), so a red flaky job reports first and does not hide the rest.
  flaky-ubuntu:
    name: check (ubuntu-latest, flaky)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-run
        with:
          group: flaky

      # One line on the run's page. The full summary.md rides in the artifact, so the rollup is not buried under 12 of them.
      - name: summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ci-ubuntu-latest-flaky-attempt-${{ github.run_attempt }}
        run: |
          echo "- check (ubuntu-latest, flaky): $JOB_STATUS, full report in artifact \`$ARTIFACT\` (summary.md)" >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-ubuntu-latest-flaky-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-macos:
    name: check (macos-latest, flaky)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-run
        with:
          group: flaky

      # One line on the run's page. The full summary.md rides in the artifact, so the rollup is not buried under 12 of them.
      - name: summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ci-macos-latest-flaky-attempt-${{ github.run_attempt }}
        run: |
          echo "- check (macos-latest, flaky): $JOB_STATUS, full report in artifact \`$ARTIFACT\` (summary.md)" >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-macos-latest-flaky-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-windows:
    name: check (windows-latest, flaky)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-run
        with:
          group: flaky

      # One line on the run's page. The full summary.md rides in the artifact, so the rollup is not buried under 12 of them.
      - name: summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ci-windows-latest-flaky-attempt-${{ github.run_attempt }}
        run: |
          echo "- check (windows-latest, flaky): $JOB_STATUS, full report in artifact \`$ARTIFACT\` (summary.md)" >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-windows-latest-flaky-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  # ALL THREE PLATFORMS, and Windows is not the afterthought. It is atrium's primary platform: ConPTY, the rename-aside
  # binary swap, the logon task, and every path rule are Windows behaviour, and a Linux-only matrix builds none of it.
  #
  # `fail-fast: false` so one platform failing still reports the other. The interesting case is exactly when they
  # disagree, and cancelling the second job hides which way.
  #
  # ONE JOB PER PLATFORM AND GROUP, so a run takes as long as its slowest group and not the sum. The groups are
  # `ci.sh --list-groups`. Runners are scarce, so the quick groups share a job, and the slower the runner the more jobs
  # it gets. Which steps belong to which, and which tests are in which half, is ci.sh's business, so this file only
  # names the group. No continue-on-error: board-visual shares jobs with go-checks, so ci.sh keeps a board-visual
  # failure out of its own exit status.
  check-ubuntu:
    needs: flaky-ubuntu
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        group: [go-all, board-1, board-2]
    name: check (ubuntu-latest, ${{ matrix.group }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-run
        with:
          group: ${{ matrix.group }}

      # One line on the run's page. The full summary.md rides in the artifact, so the rollup is not buried under 12 of them.
      - name: summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ci-ubuntu-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
        run: |
          echo "- check (ubuntu-latest, ${{ matrix.group }}): $JOB_STATUS, full report in artifact \`$ARTIFACT\` (summary.md)" >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-ubuntu-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  check-macos:
    needs: flaky-macos
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        group: [go-test, go-checks-visual, board-1, board-2]
    name: check (macos-latest, ${{ matrix.group }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-run
        with:
          group: ${{ matrix.group }}

      # One line on the run's page. The full summary.md rides in the artifact, so the rollup is not buried under 12 of them.
      - name: summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ci-macos-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
        run: |
          echo "- check (macos-latest, ${{ matrix.group }}): $JOB_STATUS, full report in artifact \`$ARTIFACT\` (summary.md)" >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-macos-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  check-windows:
    needs: flaky-windows
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        group: [go-test-1, go-test-2, go-checks-visual, board-1, board-2]
    name: check (windows-latest, ${{ matrix.group }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-run
        with:
          group: ${{ matrix.group }}

      # One line on the run's page. The full summary.md rides in the artifact, so the rollup is not buried under 12 of them.
      - name: summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ci-windows-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
        run: |
          echo "- check (windows-latest, ${{ matrix.group }}): $JOB_STATUS, full report in artifact \`$ARTIFACT\` (summary.md)" >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-windows-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  # The run page's own summary: every failing unit across the matrix, whether the alone retry passed it, and how often it
  # failed in the last 10 runs on main. THERE IS NO LOGIC HERE: `scripts/ci-rollup.js` does it all and is best effort, so
  # this job cannot fail the run and nothing waits on it.
  rollup:
    needs: [flaky-ubuntu, flaky-macos, flaky-windows, check-ubuntu, check-macos, check-windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: rollup
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-rollup.js --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY" || true

  # Tells the hub when this run failed, and only then. It needs every other job, so it starts when they are done, and
  # `failure()` keeps a green run silent. THERE IS NO LOGIC HERE: `scripts/ci-notify.sh` builds the body from this
  # run's own context, and the ziti-hook action only carries it to the hub over ziti.
  notify:
    needs: [flaky-ubuntu, flaky-macos, flaky-windows, check-ubuntu, check-macos, check-windows]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: body
        run: |
          path=$(bash scripts/ci-notify.sh)
          echo "body=$(jq -c . "$path")" >> "$GITHUB_OUTPUT"
      - uses: dovholuknf/ziti-hook@main
        with:
          transport: ziti
          url: http://ziti-hook.ziti/
          payload: ${{ steps.body.outputs.body }}
          ziti-identity: ${{ secrets.ZITI_HOOK_IDENTITY }}
          secret: ${{ secrets.ATRIUM_CI_HOOK_SECRET }}
