# Check out, install the two toolchains, call one script.
#
# THERE IS NO LOGIC IN THIS FILE and there must never be. Everything it checks
# lives in `scripts/ci.sh`, which runs on a developer's machine exactly as it
# runs here. A check that exists only inside a YAML file can only be debugged by
# pushing, and every push to debug it is a five minute round trip to discover a
# quoting mistake.
#
# The two `setup-` steps are the exception the rule allows: they are how a
# runner acquires a toolchain and they are GitHub-specific by nature. They
# configure the environment. They do not decide anything. So is the upload at
# the end, which carries off the files ci.sh wrote and decides nothing either.

name: ci

run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.name && format('ci {0}', inputs.name) || format('ci {0} {1}', inputs.os, inputs.suite)) || github.event_name == 'push' && github.event.head_commit.message || 'ci' }}

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: which os to run
        type: choice
        options: [all, ubuntu, macos, windows]
        default: all
      suite:
        description: which suite to run, go or ui (the playwright board)
        type: choice
        options: [all, go, ui]
        default: all
      name:
        description: optional label for the run title
        type: string
        required: false
        default: ""

permissions:
  contents: read

# How many times in a row each flaky group runs. Only the flaky jobs read it, via scripts/ci.sh.
env:
  FLAKY_REPEAT: 5

jobs:
  # Which jobs and groups a dispatch runs, from its os and suite inputs. scripts/ci-select.sh decides, a push runs all.
  select:
    runs-on: ubuntu-latest
    outputs:
      flaky_linux_go: ${{ steps.pick.outputs.flaky_linux_go }}
      flaky_linux_playwright: ${{ steps.pick.outputs.flaky_linux_playwright }}
      flaky_macos_go: ${{ steps.pick.outputs.flaky_macos_go }}
      flaky_macos_playwright: ${{ steps.pick.outputs.flaky_macos_playwright }}
      flaky_windows_go: ${{ steps.pick.outputs.flaky_windows_go }}
      flaky_windows_playwright: ${{ steps.pick.outputs.flaky_windows_playwright }}
      check_ubuntu: ${{ steps.pick.outputs.check_ubuntu }}
      check_macos: ${{ steps.pick.outputs.check_macos }}
      check_windows: ${{ steps.pick.outputs.check_windows }}
      skipped: ${{ steps.pick.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        shell: bash
        env:
          PICK_OS: ${{ inputs.os }}
          PICK_SUITE: ${{ inputs.suite }}
        run: bash scripts/ci-select.sh --os "$PICK_OS" --suite "$PICK_SUITE" >> "$GITHUB_OUTPUT"

  # THE FLAKY SUITE FIRST, TWO JOBS PER PLATFORM, each with a plain static name. scripts/flaky-suite.json lists the tests known to fail now and then.
  # `ci.sh --group flaky-go` runs the go ones and needs no node, `flaky-board` runs the board units and check scripts
  # and needs no Go. The flaky jobs have no `needs` and start at once, so the tests most likely
  # to fail answer first and fast. Each platform's check job waits for that platform's flaky jobs (`needs`) and is skipped
  # when a flaky group is red, so a red flaky group stops the checks from burning runner time and the flaky and check
  # groups never run beside each other on a platform. The rollup and notify read a skipped check as red, except the jobs a dispatch left out on purpose.
  flaky-linux-go:
    needs: [select]
    if: needs.select.outputs.flaky_linux_go == 'true'
    name: flaky-linux-go
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dovholuknf/atrium-ci:1
      options: --user 1001 --init
      env:
        USER: runner
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: flaky-go
          go: true
          node: false

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-ubuntu-latest-flaky-go-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-linux-playwright:
    needs: [select]
    if: needs.select.outputs.flaky_linux_playwright == 'true'
    name: flaky-linux-playwright
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dovholuknf/atrium-ci:1
      options: --user 1001 --init
      env:
        USER: runner
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: flaky-board
          go: false
          node: true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-ubuntu-latest-flaky-board-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-macos-go:
    needs: [select]
    if: needs.select.outputs.flaky_macos_go == 'true'
    name: flaky-macos-go
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: flaky-go
          go: true
          node: false

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-macos-latest-flaky-go-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-macos-playwright:
    needs: [select]
    if: needs.select.outputs.flaky_macos_playwright == 'true'
    name: flaky-macos-playwright
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: flaky-board
          go: false
          node: true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-macos-latest-flaky-board-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-windows-go:
    needs: [select]
    if: needs.select.outputs.flaky_windows_go == 'true'
    name: flaky-windows-go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: flaky-go
          go: true
          node: false

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-windows-latest-flaky-go-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  flaky-windows-playwright:
    needs: [select]
    if: needs.select.outputs.flaky_windows_playwright == 'true'
    name: flaky-windows-playwright
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: flaky-board
          go: false
          node: true

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-windows-latest-flaky-board-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  # ALL THREE PLATFORMS, and Windows is not the afterthought. It is atrium's primary platform: ConPTY, the rename-aside
  # binary swap, the logon task, and every path rule are Windows behaviour, and a Linux-only matrix builds none of it.
  #
  # Each waits for its own platform's flaky job, so a platform's checks start only once its flaky groups are green.
  #
  # `fail-fast: false` so one platform failing still reports the other. The interesting case is exactly when they
  # disagree, and cancelling the second job hides which way.
  #
  # ONE JOB PER PLATFORM AND GROUP, so a run takes as long as its slowest group and not the sum. The groups are
  # `ci.sh --list-groups`. Runners are scarce, so the quick groups share a job, and the slower the runner the more jobs
  # it gets. Which steps belong to which, and which tests are in which half, is ci.sh's business, so this file only
  # names the group. No continue-on-error: board-visual shares jobs with go-checks, so ci.sh keeps a board-visual
  # failure out of its own exit status.
  check-ubuntu:
    needs: [select, flaky-linux-go, flaky-linux-playwright]
    if: ${{ !cancelled() && needs.flaky-linux-go.result != 'failure' && needs.flaky-linux-playwright.result != 'failure' && needs.select.outputs.check_ubuntu != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.check_ubuntu) }}
    name: check (ubuntu-latest, ${{ matrix.group }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dovholuknf/atrium-ci:1
      options: --user 1001 --init
      env:
        USER: runner
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: ${{ matrix.group }}
          go: ${{ !startsWith(matrix.group, 'board') }}

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-ubuntu-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  check-macos:
    needs: [select, flaky-macos-go, flaky-macos-playwright]
    if: ${{ !cancelled() && needs.flaky-macos-go.result != 'failure' && needs.flaky-macos-playwright.result != 'failure' && needs.select.outputs.check_macos != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.check_macos) }}
    name: check (macos-latest, ${{ matrix.group }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: ${{ matrix.group }}
          go: ${{ !startsWith(matrix.group, 'board') }}

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-macos-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  check-windows:
    needs: [select, flaky-windows-go, flaky-windows-playwright]
    if: ${{ !cancelled() && needs.flaky-windows-go.result != 'failure' && needs.flaky-windows-playwright.result != 'failure' && needs.select.outputs.check_windows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.check_windows) }}
    name: check (windows-latest, ${{ matrix.group }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-run
        with:
          group: ${{ matrix.group }}
          go: ${{ !startsWith(matrix.group, 'board') }}

      # What ci.sh left in build.claude/ci, kept on a pass too, so a slow test can be compared against a run that was fine.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-windows-latest-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  # The run page's own summary: every failing unit across the matrix, whether the alone retry passed it, and how often it
  # failed in the last 10 runs on main. THERE IS NO LOGIC HERE: `scripts/ci-rollup.js` does it all and is best effort, so
  # this job cannot fail the run. The notify job waits on it, so the run's summary exists before the hub is told.
  rollup:
    needs: [select, flaky-linux-go, flaky-linux-playwright, flaky-macos-go, flaky-macos-playwright, flaky-windows-go, flaky-windows-playwright, check-ubuntu, check-macos, check-windows]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      results: ${{ join(needs.*.result, ' ') }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: rollup
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-rollup.js --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY" --failing-json failing-tests.json || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: failing-tests
          path: failing-tests.json
          retention-days: 90
          if-no-files-found: ignore

  # Tells the hub when this run finished, green or red, for now. It needs only rollup, which needs every other job and
  # hands on their results, so the graph reads rollup then notify. THERE IS NO LOGIC HERE: `scripts/ci-notify.sh` picks
  # the conclusion from the jobs' results and builds the body from this run's own context, and the ziti-hook action
  # only carries it to the hub over ziti.
  notify:
    needs: [select, rollup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: body
        env:
          NEEDS_RESULTS: ${{ needs.rollup.result }} ${{ needs.rollup.outputs.results }}
          EXPECTED_SKIPPED: ${{ needs.select.outputs.skipped }}
        run: |
          path=$(bash scripts/ci-notify.sh --needs "$NEEDS_RESULTS" --expected-skipped "$EXPECTED_SKIPPED")
          echo "body=$(jq -c . "$path")" >> "$GITHUB_OUTPUT"
      - uses: dovholuknf/ziti-hook@main
        continue-on-error: true
        with:
          transport: ziti
          url: http://ziti-hook.ziti/
          payload: ${{ steps.body.outputs.body }}
          ziti-identity: ${{ secrets.ZITI_HOOK_IDENTITY }}
          secret: ${{ secrets.ATRIUM_CI_HOOK_SECRET }}
