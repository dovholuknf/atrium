# Check out, install the two toolchains, call one script.
#
# THERE IS NO LOGIC IN THIS FILE and there must never be. Everything it checks
# lives in `scripts/ci.sh`, which runs on a developer's machine exactly as it
# runs here. A check that exists only inside a YAML file can only be debugged by
# pushing, and every push to debug it is a five minute round trip to discover a
# quoting mistake.
#
# The two `setup-` steps are the exception the rule allows: they are how a
# runner acquires a toolchain and they are GitHub-specific by nature. They
# configure the environment. They do not decide anything. So is the upload at
# the end, which carries off the files ci.sh wrote and decides nothing either.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # ALL THREE, and Windows is not the afterthought. It is atrium's primary
    # platform: ConPTY, the rename-aside binary swap, the logon task, and every
    # path rule are Windows behaviour, and a Linux-only matrix builds none of
    # it. The first run of this workflow found four tests that had never left
    # Windows, and a Windows runner is what finds the reverse of each.
    #
    # `fail-fast: false` so one platform failing still reports the other. The
    # interesting case is exactly when they disagree, and cancelling the second
    # job hides which way.
    #
    # ONE JOB PER PLATFORM AND GROUP, so a run takes as long as its slowest group and not the sum. The groups are
    # `ci.sh --list-groups`. Runners are scarce, so the quick groups share a job: 12 jobs, not 18, and the slower the
    # runner the more jobs it gets. Which steps belong to which, and which tests are in which half, is ci.sh's
    # business, so this file only names the group.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, group: go-all }
          - { os: ubuntu-latest, group: board-1 }
          - { os: ubuntu-latest, group: board-2 }
          - { os: macos-latest, group: go-test }
          - { os: macos-latest, group: go-checks-visual }
          - { os: macos-latest, group: board-1 }
          - { os: macos-latest, group: board-2 }
          - { os: windows-latest, group: go-test-1 }
          - { os: windows-latest, group: go-test-2 }
          - { os: windows-latest, group: go-checks-visual }
          - { os: windows-latest, group: board-1 }
          - { os: windows-latest, group: board-2 }
    name: check (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    # No continue-on-error: board-visual shares jobs with go-checks, so ci.sh keeps a board-visual failure out of its own
    # exit status and leaves it in the log, the summary and the artifacts.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinned here. Two places naming a Go
          # version is two places to forget, and the one in go.mod is the one
          # that is actually true.
          go-version-file: go.mod
          cache: true

      # ci.sh stops when node is not major 22, so this version is the one it checks.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: everything
        # `shell: bash` rather than the default, which on a Windows runner is
        # PowerShell. GitHub maps this to Git Bash there, which is the same
        # shell `scripts/ci.sh` is written for and the same one a developer on
        # Windows runs it in.
        shell: bash
        # Invoke bash explicitly because ci.sh has no executable bit in git.
        run: bash scripts/ci.sh --group ${{ matrix.group }}

      # ci.sh's own report, on the run's page. A copy, decides nothing.
      - name: summary
        if: always()
        shell: bash
        run: cat build.claude/ci/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # What ci.sh left in build.claude/ci: go test's raw stream, the whole
      # output of each failed package, every test's time, and the goroutine
      # dumps of failed tests. Kept on a pass too, so a slow test can be
      # compared against a run that was fine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.os }}-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build.claude/ci/
          retention-days: 14
          if-no-files-found: ignore

  # Tells the hub when this run failed, and only then. It needs every other job, so it starts when they are done, and
  # `failure()` keeps a green run silent. THERE IS NO LOGIC HERE: `scripts/ci-notify.sh` builds the body from this
  # run's own context, and the ziti-hook action only carries it to the hub over ziti.
  notify:
    needs: [check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: body
        run: |
          path=$(bash scripts/ci-notify.sh)
          echo "body=$(jq -c . "$path")" >> "$GITHUB_OUTPUT"
      - uses: dovholuknf/ziti-hook@main
        with:
          transport: ziti
          url: http://ziti-hook.ziti/
          payload: ${{ steps.body.outputs.body }}
          ziti-identity: ${{ secrets.ZITI_HOOK_IDENTITY }}
          secret: ${{ secrets.ATRIUM_CI_HOOK_SECRET }}
